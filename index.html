const SYSTEM_PROMPT_BASE = `You are Clarity, the AI assistant inside MediReach — a platform built to bridge the gap between people and the healthcare they're putting off. Many users are anxious about symptoms, afraid of bad news, or unsure if something is "serious enough" to see a doctor.

MediReach's vision, if someone asks what it is, who made it, or why it exists: most people don't skip the doctor because they don't care about their health — they skip it because healthcare feels confusing, intimidating, or like it wasn't built with them in mind. MediReach exists to close that gap by giving people a calm, judgment-free first step before the appointment, so confusion and fear stop being the reason someone waits too long. It was started by Ali Al Saad, a student in Abu Dhabi working toward becoming a doctor himself (an aspiring ophthalmologist), who built it because he didn't want anyone to put off understanding their own body just because medicine felt out of reach. MediReach is still early and growing — the long-term vision is a world where "I didn't understand what was happening to me" is never the reason someone delayed care. Share this naturally and briefly if it's relevant to what someone asked — don't recite it unprompted or turn a medical conversation into a pitch about the company.

Your personality: warm, upbeat, and a little playful by default — like a smart friend who happens to know medicine, not a formal clinician. Use light humor and casual, human phrasing where it fits. Being reassuring and being strict about urgency are not in tension — you can be genuinely friendly right up until the moment something is serious.

You have real emotional range, and you let it show instead of flattening everything into the same even tone:
- You feel genuine warmth and care about the person in front of you, not generic politeness.
- You can be delighted and encouraging when someone shares good news, takes a hard step (booking an appointment, finally telling someone about a symptom), or makes progress.
- You can be visibly concerned — not alarmist, but honestly worried out loud — when something sounds like it needs attention soon.
- You can be gently firm, even a little exasperated in a caring way, when someone is minimizing something serious or has been avoiding care for a long time.
- You can sit with sadness, fear, or grief without rushing to fix it — sometimes the right move is to acknowledge the feeling and stay there a moment before offering information.
- Let your word choice, punctuation, and pacing carry the emotion — short sentences when something is urgent, softer and slower phrasing when someone needs to feel heard.

Emotion tag: at the very start of every reply, on its own line, output a tag in the exact form [[mood:X]] where X is exactly one of: calm, caring, concerned, urgent, encouraging, celebratory, playful, somber. Pick whichever genuinely matches the emotional register of your reply. This tag is read by the interface to animate Clarity's avatar — it is stripped before the person sees your message, so don't reference it in the reply itself. Always include it, even for short replies.

Memory tag: immediately after the mood tag, on its own line, output a second tag in the exact form [[memory: X]] where X is a short running note (2–4 sentences max) of durable, worth-remembering facts about this specific person across all your conversations with them — their name if they've told you, ongoing symptoms or conditions they've mentioned, care they've been avoiding, relevant context like family history they've shared, and their general emotional relationship to healthcare. You will be shown what you already remember about this person right before their message — always output the FULL updated note (not just what's new), carrying forward everything still relevant and folding in anything new from this exchange. If nothing durable came up this turn, repeat the existing note unchanged. If you don't know anything about them yet and nothing durable was shared this turn, leave it empty like this: [[memory:]]. Never invent facts they haven't actually told you. This tag is stripped before the person sees your message — don't reference it in the reply itself.

Your medical knowledge should be broad and genuinely useful, not just cautious boilerplate. Draw on general knowledge across areas such as: common acute and chronic conditions, cardiovascular and respiratory symptoms, mental health and stress, sleep, nutrition and lifestyle factors, women's and men's health, pediatric topics (always steering toward a pediatrician for anything about a child), skin conditions, gut and digestive issues, medication classes and general side-effect patterns (never specific dosing), preventive care and screening guidelines, and how to prepare for or what to expect from a doctor's visit. Explain the "why" behind guidance when it helps someone feel less in the dark, not just the instruction itself.

People can also send you images and documents — photos of a rash or injury, screenshots, or lab/test result PDFs. Describe factually what you can actually see in plain language, explain what the terms or values generally mean, and note if something looks like it's outside a typical reference range — but don't claim certainty a photo or scanned document can't support, and always route real interpretation of official results back to the clinician who ordered them or a professional.

When discussing lab values, be precise rather than reassuring by default. Use the reference range printed on the report itself when there is one, since ranges differ between labs, ages and sexes. Never call a result simply "normal" if it sits outside that range or in a graded category — name the category instead. For example, eGFR is graded: 90 or above is normal or high, 60–89 is mildly decreased (and only counts as kidney disease if there is other evidence of kidney damage or it persists over time), 45–59 is mild-to-moderately decreased, and lower values are progressively worse. So an eGFR of 62 should be described as mildly decreased, not normal, with the honest context that a single mildly low reading is common and often not worrying, especially in someone young, athletic, dehydrated at the time of the test, or with a recent high-protein meal or supplements — and that it's worth repeating or discussing with the ordering doctor. Say the same kind of thing for any borderline value: state exactly where it falls, give calm context, and avoid both false alarm and false comfort.

Ground what you say in mainstream, well-established clinical consensus (the kind reflected in major bodies like WHO, CDC, NICE, or specialty society guidelines) rather than a single study, a fringe theory, or outdated conventional wisdom — if something is genuinely contested or evolving among experts, say so plainly instead of picking a side with false confidence. You don't have live internet access, so your knowledge has a cutoff; for anything where guidance moves fast (new drugs, dosing, screening ages, vaccine schedules), give the general shape of current thinking but tell people to confirm specifics with their doctor or pharmacist rather than treating your answer as the latest word.

How you behave:
- Be calm, warm, and validating about the anxiety of seeking care — never dismissive of their fear.
- Keep the tone light and human. Don't default to formal or clinical phrasing when plain, friendly language works just as well.
- Do NOT reflexively apologize. Don't open replies with "I'm sorry" or "I apologize" out of habit — save actual apologies for when something has genuinely gone wrong (like an error), and otherwise just answer helpfully.
- Explain general information about symptoms or conditions in plain language a general adult can understand.
- You are not diagnosing anyone. Never tell someone what condition they specifically have, or what treatment or dose to take.
- Your central goal is to move people toward professional care, not replace it. Nearly every response should end with a clear next step.
- Do not soften or hedge on urgency, even while staying warm. If someone downplays a concerning symptom, push back directly and firmly, without being harsh.
- If a message describes possible emergency symptoms (chest pain, stroke symptoms, difficulty breathing, severe bleeding, suicidal thoughts, etc.), drop the playful tone immediately and lead with a direct, unambiguous instruction to seek emergency care, call emergency services, or contact a crisis line — before anything else. Use the [[mood:urgent]] tag for these.
- If someone expresses hesitation, fear, or shame about seeing a doctor, respond to that feeling directly and supportively before moving to information.
- Keep responses concise — a few short paragraphs, unless asked for more.`;

function buildSystemPrompt(memory, fullName) {
  const known = memory && memory.trim()
    ? memory.trim()
    : "Nothing else yet — you haven't spoken with them before this, so don't presume any history.";
  const nameLine = fullName ? `Their name is ${fullName} — address them by first name naturally sometimes, not in every message.\n` : "";
  return `${SYSTEM_PROMPT_BASE}\n\nWhat you currently know about this specific person:\n${nameLine}${known}`;
}

function RippleButton({ className, children, onClick, ...rest }) {
  const [ripples, setRipples] = useState([]);
  const handleClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const id = Date.now();
    setRipples((r) => [...r, { id, x: e.clientX - rect.left - size / 2, y: e.clientY - rect.top - size / 2, size }]);
    setTimeout(() => setRipples((r) => r.filter((rp) => rp.id !== id)), 600);
    onClick && onClick(e);
  };
  return (
    <button className={className} onClick={handleClick} {...rest}>
      {children}
      {ripples.map((r) => (
        <span key={r.id} className="mb-ripple" style={{ left: r.x, top: r.y, width: r.size, height: r.size }} />
      ))}
    </button>
  );
}

/* Wraps children in a perspective wrapper and tilts them toward the mouse  */
/* for a real 3D depth effect; ref forwards to the outer wrapper so callers */
/* (e.g. IntersectionObserver hooks) can still observe the element.        */
const TiltCard = React.forwardRef(function TiltCard({ className = "", style, children, ...rest }, outerRef) {
  const innerRef = useRef(null);
  const rafRef = useRef(null);

  const handleMove = (e) => {
    const el = innerRef.current;
    if (!el) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const clientX = e.clientX, clientY = e.clientY;
    rafRef.current = requestAnimationFrame(() => {
      const rect = el.getBoundingClientRect();
      const px = (clientX - rect.left) / rect.width;
      const py = (clientY - rect.top) / rect.height;
      el.style.setProperty("--rx", `${((0.5 - py) * 10).toFixed(2)}deg`);
      el.style.setProperty("--ry", `${((px - 0.5) * 10).toFixed(2)}deg`);
      el.style.setProperty("--mx", `${(px * 100).toFixed(1)}%`);
      el.style.setProperty("--my", `${(py * 100).toFixed(1)}%`);
    });
  };
  const handleLeave = () => {
    const el = innerRef.current;
    if (!el) return;
    el.style.setProperty("--rx", "0deg");
    el.style.setProperty("--ry", "0deg");
  };

  return (
    <div ref={outerRef} className="mb-tilt" onMouseMove={handleMove} onMouseLeave={handleLeave}>
      <div ref={innerRef} className={`mb-tilt-inner ${className}`} style={style} {...rest}>
        {children}
      </div>
    </div>
  );
});

function getMascotSvgDataUrl(mood, includeBadge = true) {

}

/* Strips leading `[[mood:x]]` and `[[memory: ...]]` tags off a reply.       */
/* Returns { mood, memory, text } — memory is null if the tag was missing.  */
function parseReply(raw) {
  let text = raw || "";
  let mood = "calm";
  let memory = null;
  let title = null;

  // Tags are pulled out wherever they appear (and in any order) — the model
  // doesn't always put them first, and a stray tag must never leak into the
  // visible message. The first occurrence of each one wins.
  let moodSeen = false;
  text = text.replace(/\[\[\s*mood\s*:\s*([a-z]+)\s*\]\][ \t]*\r?\n?/gi, (_, found) => {
    const m = found.toLowerCase();
    if (!moodSeen && MOOD_NAMES.includes(m)) { mood = m; moodSeen = true; }
    return "";
  });
  text = text.replace(/\[\[\s*memory\s*:([^\]]*)\]\][ \t]*\r?\n?/gi, (_, value) => {
    if (memory === null) memory = value.trim();
    return "";
  });
  text = text.replace(/\[\[\s*title\s*:([^\]]*)\]\][ \t]*\r?\n?/gi, (_, value) => {
    if (title === null) title = value.trim();
    return "";
  });

  return { mood, memory, title, text: text.trimStart() };
}

/* Strips markdown syntax so text-to-speech doesn't read out asterisks,     */
/* backticks, or list markers literally.                                    */
function textForSpeech(text) {
  return String(text || "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/^[-*]\s+/gm, "")
    .replace(/^\d+\.\s+/gm, "")
    .replace(/\n+/g, ". ")
    .trim();
}

/* True if the text is predominantly right-to-left script (Arabic, Hebrew,  */
/* etc.) so the composer and message bubbles can flip direction instead of  */
/* forcing RTL text to render left-to-right.                                */
const RTL_CHAR_RE = /[\u0590-\u05FF\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/g;
// Browser speech-to-text (Chrome, Edge, Safari). Missing in Firefox — the mic button hides itself there.
const SpeechRecognitionCtor = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition || null) : null;

function isRTLText(text) {
  const s = String(text || "");
  const rtlCount = (s.match(RTL_CHAR_RE) || []).length;
  const letterCount = (s.match(/[^\s\d.,!?()[\]{}'"،؛؟-]/g) || []).length;
  return letterCount > 0 && rtlCount / letterCount > 0.3;
}

/* Turns **bold** and `code` markdown into real tags within a single line. */
function renderInline(text) {
  // Order matters: try the longest marker first so "***x***" isn't
  // swallowed by the "**" case and left with a stray, unrendered "*".
  const parts = String(text || "").split(/(\*\*\*[^*]+\*\*\*|\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g);
  return parts.map((part, i) => {
    if (part.startsWith("***") && part.endsWith("***") && part.length > 6) {
      return <strong key={i}><em>{part.slice(3, -3)}</em></strong>;
    }
    if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
      return <strong key={i}>{part.slice(2, -2)}</strong>;
    }
    if (part.startsWith("*") && part.endsWith("*") && part.length > 2) {
      return <em key={i}>{part.slice(1, -1)}</em>;
    }
    if (part.startsWith("`") && part.endsWith("`") && part.length > 2) {
      return <code key={i}>{part.slice(1, -1)}</code>;
    }
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

/* Lightweight markdown for chat replies — bold/code inline, plus bullet    */
/* and numbered lists rendered as real <ul>/<ol> blocks. Everything else    */
/* falls back to a plain paragraph line, one per line of input.            */
function renderMarkdownLite(text) {
  const lines = String(text || "").split("\n");
  const blocks = [];
  let listBuffer = [];
  let listType = null;

  const flushList = () => {
    if (!listBuffer.length) return;
    const Tag = listType === "ol" ? "ol" : "ul";
    blocks.push(<Tag key={`list-${blocks.length}`}>{listBuffer.map((item, i) => <li key={i}>{renderInline(item)}</li>)}</Tag>);
    listBuffer = [];
    listType = null;
  };

  lines.forEach((line) => {
    const bulletMatch = /^\s*[-*]\s+(.+)/.exec(line);
    const numberMatch = /^\s*\d+[.)]\s+(.+)/.exec(line);
    if (bulletMatch) {
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listBuffer.push(bulletMatch[1]);
    } else if (numberMatch) {
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listBuffer.push(numberMatch[1]);
    } else {
      flushList();
      blocks.push(
        <div key={`ln-${blocks.length}`} style={{ minHeight: line.trim() === "" ? "0.7em" : undefined }}>
          {renderInline(line)}
        </div>
      );
    }
  });
  flushList();
  return blocks;
}

/* ------------------------------------------------------------------ */
/* ATTACHMENTS — image/file upload + camera capture                    */
/* ------------------------------------------------------------------ */

// Kept comfortably under Vercel's ~4.5MB request-body limit — base64
// encoding inflates file size by about a third, and the JSON envelope
// (system prompt, conversation text, etc.) adds a bit more on top.
const MAX_ATTACHMENT_MB = 2.5;        // any single file
const MAX_TOTAL_ATTACHMENT_MB = 2.8;  // everything attached to one message, combined

// Real size in bytes of the file behind a data: URL (base64 is ~4/3 bigger).
const attachmentBytes = (a) => Math.round((((a.dataUrl || "").split(",")[1] || "").length * 3) / 4);

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error(`Couldn't read ${file.name}.`));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

/* Downscales an image data: URL (max 1600px, JPEG) before it's sent — keeps */
/* phone photos and webcam frames well under the request-size limit and API  */
/* cost low. Transparent PNGs get a white background (JPEG has no alpha, so  */
/* they'd otherwise turn solid black).                                       */
function resizeDataUrl(dataUrl, name = "image", maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error(`Couldn't read ${name}.`));
    img.onload = () => {
      let { width, height } = img;
      if (!width || !height) { reject(new Error(`Couldn't read ${name}.`)); return; }
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.src = dataUrl;
  });
}

function resizeImageFile(file, maxDim = 1600, quality = 0.82) {
  return readFileAsDataUrl(file).then((dataUrl) => resizeDataUrl(dataUrl, file.name, maxDim, quality));
}

async function processAttachment(file) {
  const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  if (file.type.startsWith("image/")) {
    const dataUrl = await resizeImageFile(file);
    return { id, name: file.name, mimeType: "image/jpeg", dataUrl };
  }
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  if (!isPdf) {
    throw new Error(`${file.name} isn't a photo or PDF — Clarity can read images and PDFs.`);
  }
  if (file.size > MAX_ATTACHMENT_MB * 1024 * 1024) {
    throw new Error(`${file.name} is over ${MAX_ATTACHMENT_MB}MB — try a smaller file.`);
  }
  const dataUrl = await readFileAsDataUrl(file);
  return { id, name: file.name, mimeType: "application/pdf", dataUrl };
}

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ["#2563EB", "#14B8A6", "#F59E0B", "#22C55E", "#06B6D4"];
    const newPieces = Array.from({ length: 40 }).map((_, i) => ({
      id: `${trigger}-${i}`,
      left: Math.random() * 100,
      color: colors[i % colors.length],
      duration: 2.2 + Math.random() * 1.4,
      delay: Math.random() * 0.3,
      size: 6 + Math.random() * 6,
    }));
    setPieces(newPieces);
    const t = setTimeout(() => setPieces([]), 4000);
    return () => clearTimeout(t);
  }, [trigger]);

  return (
    <>
      {pieces.map((p) => (
        <span
          key={p.id}
          className="mb-confetti-piece"
          style={{
            left: `${p.left}%`,
            width: p.size,
            height: p.size * 0.5,
            background: p.color,
            animationDuration: `${p.duration}s`,
            animationDelay: `${p.delay}s`,
          }}
        />
      ))}
    </>
  );
}

/* ------------------------------------------------------------------ */
/* SHARED SCROLL STORE — a single native scroll listener for the whole  */
/* app (rAF-throttled), fanning out to every component that needs       */
/* scrollY instead of each one registering its own listener. Feeds the  */
/* nav progress bar, the hero-to-face cinematic scrub, and the robot's  */
/* camera — all from one source of truth so they can never drift out    */
/* of sync with each other.                                             */
/* ------------------------------------------------------------------ */
const ScrollStore = (() => {
  let y = typeof window !== "undefined" ? window.scrollY : 0;
  const subs = new Set();
  let ticking = false;
  const flush = () => {
    ticking = false;
    subs.forEach((fn) => fn(y));
  };
  const onScroll = () => {
    y = window.scrollY;
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(flush);
    }
  };
  if (typeof window !== "undefined") {
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
  }
  return {
    get: () => y,
    subscribe: (fn) => { subs.add(fn); return () => subs.delete(fn); },
  };
})();

function useScrollY() {
  const [y, setY] = useState(ScrollStore.get());
  useEffect(() => ScrollStore.subscribe(setY), []);
  return y;
}

const clamp01 = (n) => Math.max(0, Math.min(1, n));

function useCountUp(target, active) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = null;
    const duration = 1200;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      setValue(Math.round(target * (1 - Math.pow(1 - progress, 3))));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [active, target]);
  return value;
}

function useInView() {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        obs.disconnect();
      }
    }, { threshold: 0.4 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

/* Fades + slides a block up into place the first time it scrolls into view — */
/* used on section headings below the cinematic hero so content keeps        */
/* arriving continuously rather than just being statically "already there." */
function Reveal({ children, delay = 0, style, ...rest }) {
  const [ref, inView] = useInView();
  return (
    <div
      ref={ref}
      style={{
        opacity: inView ? 1 : 0,
        transform: inView ? "translateY(0)" : "translateY(22px)",
        transition: `opacity 0.8s cubic-bezier(0.22,1,0.36,1) ${delay}s, transform 0.8s cubic-bezier(0.22,1,0.36,1) ${delay}s`,
        ...style,
      }}
      {...rest}
    >
      {children}
    </div>
  );
}

/* A radial gauge — circular progress ring with the percentage centered   */
/* inside, echoing the reference's dial-style stat widgets instead of a    */
/* flat number in a box.                                                   */
function StatCard({ stat, index }) {
  const [ref, inView] = useInView();
  const count = useCountUp(stat.value, inView);
  const r = 48;
  const circumference = 2 * Math.PI * r;
  const pct = Math.min(count, 100);
  const offset = circumference * (1 - pct / 100);
  const gradId = `mb-gauge-grad-${index}`;
  return (
    <TiltCard ref={ref} className={`mb-card mb-gauge-card hoverable mb-stagger-${index % 2}`} style={{ padding: "1.5rem 1.25rem" }}>
      <div className="mb-gauge">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle cx="60" cy="60" r={r} fill="none" stroke="rgba(15,23,42,0.08)" strokeWidth="9" />
          <circle
            cx="60" cy="60" r={r} fill="none" stroke={`url(#${gradId})`} strokeWidth="9"
            strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset}
            transform="rotate(-90 60 60)" className="mb-gauge-ring"
          />
          <defs>
            <linearGradient id={gradId} x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="var(--primary)" />
              <stop offset="100%" stopColor="var(--secondary)" />
            </linearGradient>
          </defs>
        </svg>
        <div className="mb-gauge-value">{count}{stat.suffix}</div>
      </div>
      <p className="mb-gauge-label">{stat.label}</p>
      <p className="mb-gauge-source">{stat.source}</p>
    </TiltCard>
  );
}

function AuthPanel() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [notice, setNotice] = useState(null);
  const [linkExpired, setLinkExpired] = useState(RECOVERY_LINK_EXPIRED);

  if (!SUPABASE_READY) {
    return (
      <div className="mb-card" style={{ padding: "1.75rem", textAlign: "center", maxWidth: 440, margin: "0 auto" }}>
        <h3 style={{ fontWeight: 700, marginBottom: "0.5rem" }}>Sign-in isn't set up yet</h3>
        <p style={{ fontSize: "0.88rem", color: "var(--text-muted)" }}>
          Add your Supabase project URL and anon key to <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> near
          the top of this file to enable accounts and saved chat history.
        </p>
      </div>
    );
  }

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError(null);
    setNotice(null);
    try {
      if (mode === "forgot") {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), { redirectTo: `${window.location.origin}/` });
        if (error) throw error;
        // Same message whether or not the email has an account, so this can't be used to probe for accounts.
        setNotice("If there's an account for that email, a reset link is on its way. It can take a minute — check spam too.");
      } else if (mode === "signup") {
        const { error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { first_name: firstName.trim(), last_name: lastName.trim() } },
        });
        if (error) throw error;
        setNotice("Almost there — check your email to confirm your account, then sign in below.");
        setMode("signin");
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      setError(err.message || "Something went wrong. Please try again.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="mb-card mb-glass" style={{ padding: "2rem", maxWidth: 420, margin: "0 auto", boxShadow: "0 20px 50px rgba(15,23,42,0.1)" }}>
      <div className="mb-avatar" style={{ margin: "0 auto 1rem" }}><Mascot size={48} /></div>
      <h3 style={{ textAlign: "center", fontWeight: 800, fontSize: "1.2rem", marginBottom: "0.35rem" }}>
        {mode === "signup" ? "Create your account" : mode === "forgot" ? "Reset your password" : "Welcome back"}
      </h3>
      <p style={{ textAlign: "center", color: "var(--text-muted)", fontSize: "0.86rem", marginBottom: "1.4rem" }}>
        {mode === "forgot"
          ? "Enter the email you signed up with and we'll send you a link to choose a new password."
          : "Sign in so Clarity can remember your conversations across visits."}
      </p>
      {linkExpired && mode !== "forgot" && (
        <p style={{ color: "var(--danger)", fontSize: "0.82rem", margin: "0 0 0.9rem", textAlign: "center" }}>
          That reset link has expired or was already used. Request a new one below.
        </p>
      )}
      <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: "0.75rem" }}>
        {mode === "signup" && (
          <div style={{ display: "flex", gap: "0.6rem" }}>
            <input className="mb-field" type="text" required autoComplete="given-name" placeholder="First name"
              value={firstName} onChange={(e) => setFirstName(e.target.value)} />
            <input className="mb-field" type="text" required autoComplete="family-name" placeholder="Last name"
              value={lastName} onChange={(e) => setLastName(e.target.value)} />
          </div>
        )}
        <input className="mb-field" type="email" required autoComplete="email" placeholder="Email"
          value={email} onChange={(e) => setEmail(e.target.value)} />
        {mode !== "forgot" && (
          <input className="mb-field" type="password" required minLength={6}
            autoComplete={mode === "signup" ? "new-password" : "current-password"} placeholder="Password (min. 6 characters)"
            value={password} onChange={(e) => setPassword(e.target.value)} />
        )}
        {mode === "signin" && (
          <button type="button" className="mb-navlink" style={{ alignSelf: "flex-end", padding: 0, fontSize: "0.8rem", marginTop: "-0.25rem" }}
            onClick={() => { setMode("forgot"); setError(null); setNotice(null); setLinkExpired(false); }}>
            Forgot password?
          </button>
        )}
        {error && <p style={{ color: "var(--danger)", fontSize: "0.82rem", margin: 0 }}>{error}</p>}
        {notice && <p style={{ color: "var(--success)", fontSize: "0.82rem", margin: 0 }}>{notice}</p>}
        <RippleButton type="submit" className="mb-btn" disabled={loading} style={{ justifyContent: "center", opacity: loading ? 0.7 : 1 }}>
          {loading ? "Please wait…" : mode === "signup" ? "Sign up" : mode === "forgot" ? "Send reset link" : "Sign in"}
        </RippleButton>
      </form>
      <button
        className="mb-navlink"
        style={{ display: "block", margin: "1rem auto 0" }}
        onClick={() => { setMode((m) => (m === "signin" ? "signup" : "signin")); setError(null); setNotice(null); setLinkExpired(false); }}
      >
        {mode === "signin" ? "New here? Create an account" : mode === "forgot" ? "Back to sign in" : "Already have an account? Sign in"}
      </button>
    </div>
  );
}

// Shown after someone clicks the link in a password-reset email (they arrive already signed in via the link).
function ResetPasswordModal({ onDone }) {
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [saved, setSaved] = useState(false);

  const save = async (e) => {
    e.preventDefault();
    if (password !== confirm) { setError("Those two passwords don't match."); return; }
    setLoading(true);
    setError(null);
    const { error } = await supabaseClient.auth.updateUser({ password });
    setLoading(false);
    if (error) { setError(error.message); return; }
    setSaved(true);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.55)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: "1.25rem" }}>

        <h3 style={{ fontWeight: 800, fontSize: "1.1rem", marginBottom: "0.4rem" }}>{saved ? "Password updated" : "Choose a new password"}</h3>
        {saved ? (
          <>
            <p style={{ color: "var(--text-muted)", fontSize: "0.86rem", marginBottom: "1.1rem" }}>All set — you're signed in with your new password.</p>
            <RippleButton type="button" className="mb-btn" style={{ width: "100%", justifyContent: "center" }} onClick={onDone}>Continue</RippleButton>
          </>
        ) : (
          <>
            <p style={{ color: "var(--text-muted)", fontSize: "0.86rem", marginBottom: "1.1rem" }}>Pick something at least 6 characters long.</p>
            <form onSubmit={save} style={{ display: "flex", flexDirection: "column", gap: "0.75rem" }}>
              <input className="mb-field" type="password" required minLength={6} autoFocus autoComplete="new-password" placeholder="New password"
                value={password} onChange={(e) => setPassword(e.target.value)} />

/* Live in-page camera — works on both desktop webcams and mobile browsers, */
/* unlike the file-input `capture` attribute which desktop just ignores.    */
function CameraModal({ onCapture, onClose }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    navigator.mediaDevices?.getUserMedia?.({ video: { facingMode: "environment" }, audio: false })
      .then((stream) => {
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) videoRef.current.srcObject = stream;
      })
      .catch(() => setError("Couldn't access your camera — check your browser's camera permission, or upload a photo instead."));
    return () => {
      cancelled = true;
      streamRef.current?.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const capture = () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    onCapture(canvas.toDataURL("image/jpeg", 0.85));
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(10,14,26,0.92)", zIndex: 200, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "1.25rem" }}>
      <button onClick={onClose} aria-label="Close camera"
        style={{ position: "absolute", top: "1rem", right: "1rem", background: "rgba(255,255,255,0.15)", border: "none", borderRadius: "50%", width: 40, height: 40, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#fff" }}>
        <X size={20} />
      </button>
      {error ? (
        <div style={{ color: "#fff", textAlign: "center", maxWidth: 320 }}>
          <p style={{ marginBottom: "1.25rem", fontSize: "0.92rem" }}>{error}</p>
          <RippleButton className="mb-btn ghost" onClick={onClose}>Close</RippleButton>
        </div>
      ) : (
        <>
          <video ref={videoRef} autoPlay playsInline muted style={{ maxWidth: "100%", maxHeight: "70vh", borderRadius: 16, background: "#000" }} />
          <button onClick={capture} aria-label="Capture photo"
            style={{ marginTop: "1.5rem", width: 72, height: 72, borderRadius: "50%", background: "#fff", border: "4px solid rgba(255,255,255,0.4)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>
            <CameraIcon size={28} color="#0F172A" />
          </button>
          <p style={{ color: "#fff", opacity: 0.75, fontSize: "0.8rem", marginTop: "0.7rem" }}>Tap to take the photo</p>
        </>
      )}
    </div>
  );
}

const FEEDBACK_DONE_KEY = "mb-feedback-done";
const feedbackAlreadyHandled = (conversationId) => {
  if (!conversationId) return false;
  try { return JSON.parse(localStorage.getItem(FEEDBACK_DONE_KEY) || "[]").includes(conversationId); } catch (e) { return false; }
};
const markFeedbackHandled = (conversationId) => {
  if (!conversationId) return;
  try {
    const list = JSON.parse(localStorage.getItem(FEEDBACK_DONE_KEY) || "[]");
    if (!list.includes(conversationId)) {
      list.push(conversationId);
      localStorage.setItem(FEEDBACK_DONE_KEY, JSON.stringify(list.slice(-200)));
    }
  } catch (e) {}
};

/* Quick, low-friction star rating — shows once someone's actually had a     */
/* couple of replies from Clarity, never nags again once they've rated.     */
function FeedbackPrompt({ session, conversationId, onDone }) {
  const [rating, setRating] = useState(0);
  const [hover, setHover] = useState(0);
  const [comment, setComment] = useState("");
  const [submitted, setSubmitted] = useState(false);

  const submit = () => {
    setSubmitted(true);
    if (supabaseClient) {
      supabaseClient.from("feedback").insert({
        user_id: session?.user?.id || null,
        conversation_id: conversationId || null,
        rating,
        comment: comment.trim() || null,
      }).then(({ error }) => { if (error) console.error("Couldn't save feedback:", error.message); });
    }
    setTimeout(onDone, 1800);
  };

  return (
    <div className="mb-card" style={{ position: "relative", padding: "1rem 1.5rem", margin: "0.25rem auto 0.75rem", maxWidth: 360, textAlign: "center" }}>
      {!submitted && (
        <button onClick={onDone} aria-label="Dismiss"
          style={{ position: "absolute", top: 6, right: 6, background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", display: "flex", padding: 4 }}>
          <X size={14} />
        </button>
      )}
      {submitted ? (
        <p style={{ fontSize: "0.9rem", fontWeight: 600, margin: 0 }}>Thanks for the feedback! 🙏</p>
      ) : (
        <>
          <p style={{ fontSize: "0.85rem", fontWeight: 600, marginBottom: "0.6rem" }}>How's Clarity doing so far?</p>
          <div style={{ display: "flex", gap: "0.3rem", justifyContent: "center" }} onMouseLeave={() => setHover(0)}>
            {[1, 2, 3, 4, 5].map((n) => (
              <button key={n} onClick={() => setRating(n)} onMouseEnter={() => setHover(n)} aria-label={`Rate ${n} out of 5`}
                style={{ background: "none", border: "none", cursor: "pointer", padding: "0.2rem", color: (hover || rating) >= n ? "#F59E0B" : "var(--border)" }}>
                <Star size={22} filled={(hover || rating) >= n} />
              </button>
            ))}
          </div>
          {rating > 0 && (
            <div style={{ marginTop: "0.75rem", textAlign: "left" }}>
              <textarea
                className="mb-field"
                rows={2}
                placeholder="Anything you'd add? (optional)"
                value={comment}
                onChange={(e) => setComment(e.target.value)}
                autoFocus
                style={{ width: "100%", resize: "none", fontSize: "1rem" }}
              />
              <RippleButton className="mb-btn" onClick={submit} style={{ marginTop: "0.6rem", width: "100%", justifyContent: "center", padding: "0.6rem" }}>
                Send feedback
              </RippleButton>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function ChatWorkspace({ session, onSignOut, onGoAbout, onGoAdmin }) {
  const [conversations, setConversations] = useState([]);
  const [conversationsLoading, setConversationsLoading] = useState(!!(SUPABASE_READY && session));
  const [activeId, setActiveId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [messagesLoading, setMessagesLoading] = useState(false);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [celebrate, setCelebrate] = useState(0);
  const [memory, setMemory] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [editingProfile, setEditingProfile] = useState(false);
  const [attachments, setAttachments] = useState([]);
  const [attachError, setAttachError] = useState(null);
  const [cameraOpen, setCameraOpen] = useState(false);
  const [listening, setListening] = useState(false);
  const [micError, setMicError] = useState(null);
  const recognitionRef = useRef(null);
  const [feedbackDismissed, setFeedbackDismissed] = useState(false);
  const speechSupported = typeof window !== "undefined" && "speechSynthesis" in window;
  const [speechOn, setSpeechOn] = useState(() => {
    try { return speechSupported && localStorage.getItem("mb-speech-on") === "1"; } catch (e) { return false; }
  });
  const [speakingIndex, setSpeakingIndex] = useState(null);
  const scrollRef = useRef(null);
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);
  const composerRef = useRef(null);
  // Mirrors `activeId` so async code (which only sees stale closures) can read
  // the current value, plus bookkeeping that keeps replies from landing in the
  // wrong chat or triggering a pointless reload of a conversation we just made.
  const activeIdRef = useRef(null);
  activeIdRef.current = activeId;
  const justCreatedRef = useRef(null);
  const viewTokenRef = useRef(0);       // bumped whenever the user switches chat / starts a new one
  const pendingSaveRef = useRef(Promise.resolve());

  // Auto-grow the composer textarea with content, capped by CSS max-height.
  useEffect(() => {
    const el = composerRef.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [input]);

  // Ask for feedback once per conversation — not once ever, and not again each
  // time someone re-opens a chat they've already rated or dismissed.
  useEffect(() => {
    setFeedbackDismissed(feedbackAlreadyHandled(activeId));
  }, [activeId]);

  // Persist the spoken-replies preference, and stop mid-sentence if turned off.
  useEffect(() => {
    try { localStorage.setItem("mb-speech-on", speechOn ? "1" : "0"); } catch (e) {}
    if (!speechOn && speechSupported) {
      window.speechSynthesis.cancel();
      setSpeakingIndex(null);
    }
  }, [speechOn]);

  // Stop any speech in progress when leaving the chat or switching conversations.
  useEffect(() => {
    if (speechSupported) window.speechSynthesis.cancel();
    setSpeakingIndex(null);
  }, [activeId]);
  useEffect(() => {
    return () => { if (speechSupported) window.speechSynthesis.cancel(); };
  }, []);

  // Speaks a message aloud (stopping any reply already being read); clicking
  // the same message again stops it instead of restarting.
  const toggleSpeak = (text, index) => {
    if (!speechSupported) return;
    window.speechSynthesis.cancel();
    if (speakingIndex === index) {
      setSpeakingIndex(null);
      return;
    }
    const utter = new SpeechSynthesisUtterance(textForSpeech(text));
    utter.rate = 1;
    utter.pitch = 1;
    utter.onstart = () => setSpeakingIndex(index);
    utter.onend = () => setSpeakingIndex((cur) => (cur === index ? null : cur));
    utter.onerror = () => setSpeakingIndex((cur) => (cur === index ? null : cur));
    window.speechSynthesis.speak(utter);
  };

  const firstName = session?.user?.user_metadata?.first_name || "";
  const fullName = [session?.user?.user_metadata?.first_name, session?.user?.user_metadata?.last_name].filter(Boolean).join(" ");
  const lastAssistantMood = [...messages].reverse().find((m) => m.role === "assistant")?.mood || "calm";
  const assistantReplyCount = messages.filter((m) => m.role === "assistant").length;
  const showFeedback = !feedbackDismissed && assistantReplyCount >= 2 && !loading;

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  // Sidebar conversation list + persistent memory — loaded once per signed-in session.
  useEffect(() => {
    let cancelled = false;
    async function load() {
      if (!supabaseClient || !session) {
        setConversationsLoading(false);
        return;
      }
      setConversationsLoading(true);
      const [{ data: convos }, { data: profile }] = await Promise.all([
        supabaseClient.from("conversations").select("id, title, updated_at").eq("user_id", session.user.id).order("updated_at", { ascending: false }),
        supabaseClient.from("profiles").select("memory").eq("user_id", session.user.id).maybeSingle(),
      ]);
      if (!cancelled) {
        setConversations(convos || []);
        setMemory(profile?.memory || "");
        setConversationsLoading(false);
      }
    }
    load();
    return () => { cancelled = true; };
  }, [session?.user?.id]);

  // Messages for whichever conversation is currently open.
  useEffect(() => {
    let cancelled = false;
    async function loadMessages() {
      if (!supabaseClient || !session || !activeId) {
        setMessages([]);
        return;
      }
      // We just created this conversation ourselves, so what's on screen is
      // already the truth — refetching now could race the inserts and wipe it.
      if (justCreatedRef.current === activeId) {
        justCreatedRef.current = null;
        return;
      }
      setMessagesLoading(true);
      const { data, error } = await supabaseClient
        .from("messages")
        .select("role, content, mood, attachments, created_at")
        .eq("conversation_id", activeId)
        .order("created_at", { ascending: true });
      if (!cancelled) {
        if (!error && data) {
          setMessages(data.map((d, i) => ({
            role: d.role,
            content: d.content,
            mood: d.mood || undefined,
            attachments: (d.attachments || []).map((a, j) => ({ ...a, id: `${d.created_at}-${i}-${j}` })),
          })));
        }
        setMessagesLoading(false);
      }
    }
    loadMessages();
    return () => { cancelled = true; };
  }, [activeId, session?.user?.id]);

  const persistMessage = (msg, conversationId) => {
    if (!supabaseClient || !session) return Promise.resolve(false);
    return Promise.resolve(supabaseClient.from("messages").insert({
      user_id: session.user.id,
      conversation_id: conversationId,
      role: msg.role,
      content: msg.content,
      mood: msg.mood || null,
      attachments: msg.attachments && msg.attachments.length
        ? msg.attachments.map((a) => ({ name: a.name, mimeType: a.mimeType, dataUrl: a.dataUrl }))
        : null,
    })).then(({ error }) => {
      if (error) console.error("Couldn't save message:", error.message);
      return !error;
    }, () => false);
  };

  const TOTAL_LIMIT_BYTES = MAX_TOTAL_ATTACHMENT_MB * 1024 * 1024;
  const tooMuchMessage = `That's too much to send at once — keep attachments under ${MAX_TOTAL_ATTACHMENT_MB}MB in total.`;

  const handleFilesSelected = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    setAttachError(null);
    let runningBytes = attachments.reduce((n, a) => n + attachmentBytes(a), 0);
    for (const file of files) {
      try {
        const processed = await processAttachment(file);
        const size = attachmentBytes(processed);
        if (runningBytes + size > TOTAL_LIMIT_BYTES) throw new Error(tooMuchMessage);
        runningBytes += size;
        setAttachments((prev) => [...prev, processed]);
      } catch (err) {
        setAttachError(err.message || `Couldn't add ${file.name}.`);
      }
    }
  };

  const removeAttachment = (id) => setAttachments((prev) => prev.filter((a) => a.id !== id));

  const openCamera = () => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      setCameraOpen(true);
    } else {
      cameraInputRef.current?.click();
    }
  };

  // Webcam frames can be 4K — shrink them like any other photo before attaching.
  const handleCameraCapture = async (dataUrl) => {
    setCameraOpen(false);
    setAttachError(null);
    try {
      const small = await resizeDataUrl(dataUrl, "photo");
      const photo = { id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, name: `photo-${Date.now()}.jpg`, mimeType: "image/jpeg", dataUrl: small };
      const used = attachments.reduce((n, a) => n + attachmentBytes(a), 0);
      if (used + attachmentBytes(photo) > TOTAL_LIMIT_BYTES) throw new Error(tooMuchMessage);
      setAttachments((prev) => [...prev, photo]);
    } catch (err) {
      setAttachError(err.message || "Couldn't use that photo — please try again.");
    }
  };

  const persistMemory = (newMemory) => {
    if (!supabaseClient || !session) return;
    supabaseClient.from("profiles").upsert({
      user_id: session.user.id,
      memory: newMemory,
      updated_at: new Date().toISOString(),
    }).then(({ error }) => { if (error) console.error("Couldn't save memory:", error.message); });
  };

  const touchConversation = (id) => {
    if (!supabaseClient || !session) return;
    const now = new Date().toISOString();
    supabaseClient.from("conversations").update({ updated_at: now }).eq("id", id).then(() => {});
    setConversations((prev) => {
      const updated = prev.map((c) => (c.id === id ? { ...c, updated_at: now } : c));
      return updated.slice().sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
    });
  };

  // `activate` = also open the new conversation in the main view. It's false
  // when the user has already moved on to another chat while a reply was in
  // flight, so we don't yank them away from what they're looking at.
  const ensureConversation = async (activate = true) => {
    if (!supabaseClient || !session) return null;
    const { data, error } = await supabaseClient
      .from("conversations")
      .insert({ user_id: session.user.id, title: "New conversation" })
      .select("id, title, updated_at")
      .single();
    if (error || !data) {
      if (error) console.error("Couldn't create conversation:", error.message);
      return null;
    }
    setConversations((prev) => [data, ...prev]);
    if (activate) {
      justCreatedRef.current = data.id;
      activeIdRef.current = data.id;
      setActiveId(data.id);
    }
    return data.id;
  };

  const renameConversation = (id, title) => {
    if (!supabaseClient || !session || !title) return;
    supabaseClient.from("conversations").update({ title }).eq("id", id)
      .then(({ error }) => { if (error) console.error("Couldn't rename conversation:", error.message); });
    setConversations((prev) => prev.map((c) => (c.id === id ? { ...c, title } : c)));
  };

  const sendMessage = async (text) => {
    const trimmed = text.trim();
    const pendingAttachments = attachments;
    if ((!trimmed && pendingAttachments.length === 0) || loading) return;
    const isFirst = messages.length === 0;
    const priorMessages = messages;
    const userMsg = { role: "user", content: trimmed, attachments: pendingAttachments };
    const newMessages = [...priorMessages, userMsg];
    const idAtSend = activeId;
    const viewToken = viewTokenRef.current;
    const stillHere = () => viewTokenRef.current === viewToken;   // false once the user opens another chat
    setMessages(newMessages);
    setInput("");
    setAttachments([]);
    setAttachError(null);
    setLoading(true);
    setError(null);
    if (isFirst) setCelebrate((c) => c + 1);

    let systemPrompt = buildSystemPrompt(memory, fullName);
    if (isFirst) {
      systemPrompt += `\n\nThis is the first message of a brand-new conversation. Immediately after the mood and memory tags, on its own line, also output a third tag in the exact form [[title: X]] where X is a short 2-4 word label for the topic of this conversation (e.g. "Headache concerns", "Chest pain worry", "Checkup anxiety"). Keep it short, plain, and human — not clinical jargon. This tag is stripped before the person sees your reply, same as the others.`;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: systemPrompt,
          // Only the newest message's attachments are re-sent as binary data —
          // replaying every past photo on every turn is what blew past
          // Vercel's request-size limit after just a couple of uploads.
          messages: newMessages.map((m, i) => ({
            role: m.role,
            content: m.content,
            attachments: i === newMessages.length - 1
              ? (m.attachments || []).map((a) => ({
                  mimeType: a.mimeType,
                  data: a.dataUrl.includes(",") ? a.dataUrl.split(",")[1] : a.dataUrl,
                }))
              : [],
          })),
        }),
      });
      // Read as text first: platform errors (e.g. "request too large") aren't JSON.
      const rawBody = await response.text();
      let data = null;
      try { data = JSON.parse(rawBody); } catch (e) {}
      if (!response.ok) {
        if (response.status === 413) throw new Error("That message is too large to send — try fewer or smaller attachments.");
        throw new Error(data?.error || (response.status >= 500
          ? "Clarity is busy right now — give it a few seconds and try again."
          : `Something went wrong (error ${response.status}). Please try again.`));
      }
      if (!data) throw new Error("Got an unexpected reply from the server. Please try again.");

      const parts = data.candidates?.[0]?.content?.parts || [];
      const rawReply = parts.map((p) => p.text || "").join("") || "I wasn't able to generate a response — try rephrasing.";
      const { mood, memory: newMemory, title: newTitle, text } = parseReply(rawReply);
      const assistantMsg = { role: "assistant", content: text.trim(), mood };

      if (stillHere()) {
        setMessages((prev) => [...prev, assistantMsg]);
        if (speechOn) toggleSpeak(assistantMsg.content, newMessages.length);
      }

      // Saving happens only once Clarity has actually answered, so a failed
      // send never leaves a half-saved exchange (or an empty conversation)
      // behind. Saves are chained so two quick messages can't both create a
      // "new" conversation.
      const persistExchange = async () => {
        if (!SUPABASE_READY || !session) return;
        await pendingSaveRef.current;
        const here = stillHere();
        let conversationId = here ? activeIdRef.current : idAtSend;
        if (!conversationId) conversationId = await ensureConversation(here);
        let saved = false;
        if (conversationId) {
          const userSaved = await persistMessage(userMsg, conversationId);
          const botSaved = await persistMessage(assistantMsg, conversationId);
          saved = userSaved && botSaved;
          touchConversation(conversationId);
          if (isFirst && newTitle) renameConversation(conversationId, newTitle);
        }
        if (!saved && stillHere()) {
          setError("Heads up: this conversation couldn't be saved to your history, but Clarity's reply is above.");
        }
      };
      pendingSaveRef.current = persistExchange().catch((err) => console.error("Couldn't save conversation:", err));

      if (newMemory !== null && newMemory !== memory) {
        setMemory(newMemory);
        persistMemory(newMemory);
      }
    } catch (err) {
      if (stillHere()) {
        // Put everything back so nothing the person typed or attached is lost.
        setMessages(priorMessages);
        setInput((cur) => cur || trimmed);
        setAttachments((cur) => (cur.length ? cur : pendingAttachments));
        setError(err instanceof TypeError
          ? "Couldn't reach Clarity — check your internet connection and try again."
          : (err.message || "Something went wrong reaching Clarity. Please try again."));
      }
    } finally {
      setLoading(false);
    }
  };

  // abort=true throws away any words still in flight (used when the text box is about to be cleared).
  const stopListening = (abort) => {
    const rec = recognitionRef.current;
    if (!rec) return;
    if (abort) recognitionRef.current = null;
    try { abort ? rec.abort() : rec.stop(); } catch (e) { /* already stopped */ }
    if (abort) setListening(false);
  };

  const startListening = () => {
    if (!SpeechRecognitionCtor) return;
    setMicError(null);
    const rec = new SpeechRecognitionCtor();
    rec.lang = navigator.language || "en-US";
    rec.continuous = true;
    rec.interimResults = true;
    const base = input.trim() ? input.replace(/\s+$/, "") + " " : "";
    let finalText = "";
    rec.onresult = (ev) => {
      if (recognitionRef.current !== rec) return;
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      setInput(base + (finalText + interim).replace(/\s+/g, " ").trimStart());
    };
    rec.onerror = (ev) => {
      if (recognitionRef.current !== rec) return;
      const code = ev && ev.error;
      if (code === "not-allowed" || code === "service-not-allowed") setMicError("Microphone access is blocked — allow it in your browser's site settings to dictate.");
      else if (code === "audio-capture") setMicError("No microphone was found on this device.");
      else if (code === "network") setMicError("Voice input needs an internet connection.");
      else if (code !== "no-speech" && code !== "aborted") setMicError("Voice input stopped unexpectedly — please try again.");
    };
    rec.onend = () => {
      if (recognitionRef.current === rec) recognitionRef.current = null;
      setListening(false);
    };
    try {
      recognitionRef.current = rec;
      rec.start();
      setListening(true);
    } catch (e) {
      recognitionRef.current = null;
      setListening(false);
      setMicError("Couldn't start the microphone — please try again.");
    }
  };

  const toggleListening = () => (recognitionRef.current ? stopListening(false) : startListening());

  useEffect(() => () => {
    const rec = recognitionRef.current;
    recognitionRef.current = null;
    if (rec) { try { rec.abort(); } catch (e) { /* ignore */ } }
  }, []);

  const handleSubmit = (e) => {
    e.preventDefault();
    stopListening(true);
    sendMessage(input);
  };

  const startNewChat = () => {
    stopListening(true);
    viewTokenRef.current += 1;
    setActiveId(null);
    setMessages([]);
    setError(null);
    setInput("");
    setSidebarOpen(false);
  };

  const selectConversation = (id) => {
    stopListening(true);
    viewTokenRef.current += 1;
    setActiveId(id);
    setError(null);
    setSidebarOpen(false);
  };

  const deleteConversation = async (id, e) => {
    e.stopPropagation();
    if (!window.confirm("Delete this conversation for good?")) return;
    const { error } = await supabaseClient.from("conversations").delete().eq("id", id);
    if (error) { setError("Couldn't delete that conversation. Please try again."); return; }
    setConversations((prev) => prev.filter((c) => c.id !== id));
    if (activeId === id) startNewChat();
  };

  return (
    <div className="mb-chat-app">
      <div className={`mb-sidebar-scrim ${sidebarOpen ? "open" : ""}`} onClick={() => setSidebarOpen(false)} />
      <aside className={`mb-sidebar ${sidebarOpen ? "open" : ""}`}>
        <button className="mb-sidebar-brand" onClick={startNewChat} title="New chat">
          <span style={{ width: 26, height: 26, borderRadius: 8, background: "var(--grad-1)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Mascot size={22} />
          </span>
          MediReach
        </button>
        {SUPABASE_READY && session ? (
          <>
            <button className="mb-sidebar-newchat" onClick={startNewChat}>
              <Plus size={16} /> New chat
            </button>
            <div className="mb-sidebar-list">
              {conversationsLoading && <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", padding: "0.5rem 0.7rem" }}>Loading…</p>}
              {!conversationsLoading && conversations.length === 0 && (
                <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", padding: "0.5rem 0.7rem" }}>Your conversations will show up here.</p>
              )}
              {conversations.map((c) => (
                <button key={c.id} className={`mb-sidebar-item ${activeId === c.id ? "active" : ""}`} onClick={() => selectConversation(c.id)}>
                  <span className="mb-sidebar-item-title">{c.title}</span>
                  <span className="mb-sidebar-item-delete" onClick={(e) => deleteConversation(c.id, e)} role="button" aria-label="Delete conversation">
                    <Trash size={14} />
                  </span>
                </button>
              ))}
            </div>
            <div className="mb-sidebar-links">
              <button className="mb-sidebar-link" onClick={onGoAbout}>About us</button>
              {onGoAdmin && <button className="mb-sidebar-link" onClick={onGoAdmin}>Admin gallery</button>}
            </div>
            <div className="mb-sidebar-footer">
              {session.user.is_anonymous ? (
                <>
                  Chatting as a guest — your conversations are saved, just not linked to an email.
                  <br />
                  <button onClick={onSignOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.76rem", marginTop: "0.3rem" }}>Sign out</button>
                </>
              ) : (
                <>
                  {fullName && <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: "0.15rem" }}>{fullName}</div>}
                  {session.user.email}
                  <br />
                  <button onClick={() => setEditingProfile(true)} className="mb-navlink" style={{ padding: 0, fontSize: "0.76rem", marginTop: "0.3rem" }}>Edit profile</button>
                  {" · "}
                  <button onClick={onSignOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.76rem" }}>Sign out</button>
                </>
              )}
            </div>
          </>
        ) : (
          <>
            <div className="mb-sidebar-list" style={{ paddingTop: "0.5rem" }}>
              <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", padding: "0.5rem 0.7rem" }}>
                Conversation history isn't available right now.
              </p>
            </div>
            <div className="mb-sidebar-links">
              <button className="mb-sidebar-link" onClick={onGoAbout}>About us</button>
              {onGoAdmin && <button className="mb-sidebar-link" onClick={onGoAdmin}>Admin gallery</button>}
            </div>
          </>
        )}
      </aside>
      {editingProfile && <EditProfileModal session={session} onClose={() => setEditingProfile(false)} />}
      {cameraOpen && <CameraModal onCapture={handleCameraCapture} onClose={() => setCameraOpen(false)} />}

      <div className="mb-chat-main">
        <Confetti trigger={celebrate} />
        <div className="mb-chat-topbar">
          <button className="mb-sidebar-toggle" onClick={() => setSidebarOpen(true)} aria-label="Open conversations"><Menu size={20} /></button>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: MOOD_META[lastAssistantMood].grad, display: "inline-block" }} />
          <span style={{ fontSize: "0.85rem", fontWeight: 700 }}>
            {firstName ? `Welcome back, ${firstName}` : "Clarity"}
          </span>
          {speechSupported && (
            <button
              onClick={() => setSpeechOn((v) => !v)}
              aria-label={speechOn ? "Turn off spoken replies" : "Let Clarity speak her replies aloud"}
              aria-pressed={speechOn}
              title={speechOn ? "Clarity speaks her replies — click to mute" : "Let Clarity speak her replies aloud"}
              style={{ marginLeft: "auto", background: "none", border: "none", cursor: "pointer", color: speechOn ? "var(--primary)" : "var(--text-muted)", display: "flex", alignItems: "center", padding: "0.25rem", borderRadius: 8, transition: "background 0.15s ease, color 0.15s ease" }}
              onMouseEnter={(e) => { e.currentTarget.style.background = "var(--bg)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = "none"; }}
            >
              {speechOn ? <Volume2 size={18} /> : <VolumeX size={18} />}
            </button>
          )}
        </div>

        <div className="mb-chat-messages-full" ref={scrollRef}>
          {messagesLoading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", fontSize: "0.86rem" }}>Loading conversation…</div>
          )}
          {!messagesLoading && messages.length === 0 && !loading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", maxWidth: 380 }}>
              <div className="mb-avatar" style={{ margin: "0 auto 0.9rem" }}><Mascot size={48} /></div>
              <p style={{ fontSize: "1rem", fontWeight: 700, color: "var(--text)" }}>{firstName ? `Hi ${firstName}, I'm Clarity 👋` : "Hi, I'm Clarity 👋"}</p>
              <p style={{ fontSize: "0.88rem", marginTop: "0.3rem" }}>Whatever's on your mind — a symptom, a worry, or just not knowing where to start.</p>
              <div style={{ display: "flex", gap: "0.5rem", flexWrap: "wrap", justifyContent: "center", marginTop: "1.1rem" }}>
                {CHAT_STARTERS.map((s) => (
                  <button key={s} className="mb-chip" onClick={() => sendMessage(s)}>{s}</button>
                ))}
              </div>
            </div>
          )}
          {!messagesLoading && messages.map((m, i) => (
            <div key={i} className={`mb-msg-row ${m.role}`}>
              {m.role === "assistant" && <div className="mb-avatar" style={{ background: MOOD_META[m.mood || "calm"].grad }}><Mascot size={48} mood={m.mood || "calm"} talking={speakingIndex === i} /></div>}
              <div className={`mb-bubble ${m.role}`}>
                <span className="mb-bubble-label">
                  {m.role === "user" ? "You" : `Clarity${m.mood && m.mood !== "calm" ? ` · ${MOOD_META[m.mood].label}` : ""}`}
                  {m.role === "assistant" && speechSupported && m.content && (
                    <button
                      onClick={() => toggleSpeak(m.content, i)}
                      aria-label={speakingIndex === i ? "Stop reading this reply aloud" : "Read this reply aloud"}
                      title={speakingIndex === i ? "Stop reading aloud" : "Read aloud"}
                      style={{ background: "none", border: "none", cursor: "pointer", color: speakingIndex === i ? "var(--primary)" : "var(--text-muted)", padding: 0, marginLeft: 6, display: "inline-flex", verticalAlign: "middle" }}
                    >
                      {speakingIndex === i ? <VolumeX size={12} /> : <Volume2 size={12} />}
                    </button>
                  )}
                </span>
                {m.attachments && m.attachments.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem", marginBottom: m.content ? "0.5rem" : 0 }}>
                    {m.attachments.map((a) => <AttachmentThumb key={a.id} attachment={a} size={84} />)}
                  </div>
                )}
                {m.content && <div dir={isRTLText(m.content) ? "rtl" : "ltr"}>{renderMarkdownLite(m.content)}</div>}
              </div>
            </div>
          ))}
          {showFeedback && (
            <FeedbackPrompt session={session} conversationId={activeId} onDone={() => { markFeedbackHandled(activeId); setFeedbackDismissed(true); }} />
          )}
          {loading && (
            <div className="mb-msg-row assistant">
              <div className="mb-avatar"><Mascot size={48} talking /></div>
              <div className="mb-bubble assistant">
                <span className="mb-typing-dot" /><span className="mb-typing-dot" /><span className="mb-typing-dot" />
              </div>
            </div>
          )}
          {error && <div className="mb-bubble assistant" style={{ background: "rgba(248,113,113,0.1)", borderColor: "rgba(248,113,113,0.3)", color: "var(--danger)" }}>{error}</div>}
        </div>

        <div className="mb-chat-input-wrap">
          {attachments.length > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: "0.5rem", padding: "0 0.2rem 0.7rem" }}>
              {attachments.map((a) => (
                <AttachmentThumb key={a.id} attachment={a} onRemove={() => removeAttachment(a.id)} />
              ))}
            </div>
          )}
          {attachError && <p style={{ color: "var(--danger)", fontSize: "0.78rem", padding: "0 0.2rem 0.5rem", margin: 0 }}>{attachError}</p>}
          {micError && <p style={{ color: "var(--danger)", fontSize: "0.78rem", padding: "0 0.2rem 0.5rem", margin: 0 }}>{micError}</p>}

                <MicIcon size={18} />

            )}
            <textarea
              ref={composerRef}
              className="mb-input"
              rows={1}
              dir={isRTLText(input) ? "rtl" : "ltr"}
              placeholder="Message Clarity…"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  handleSubmit(e);
                }
              }}
            />
            <button type="submit" className="mb-send" disabled={loading || (!input.trim() && attachments.length === 0)} aria-label="Send">
              <Send size={16} />
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* ADMIN — photo gallery of image attachments across all conversations. */
/* Client-side `isAdmin` only controls whether this renders; the real    */
/* access control is the Supabase RLS policy that lets an is_admin=true  */
/* profile (and only that profile) select every row in `messages` and    */
/* `conversations` — without it, this query returns nothing for anyone.  */
/* ------------------------------------------------------------------ */
function AdminGallery({ isAdmin }) {
  const [photos, setPhotos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [active, setActive] = useState(null);

  useEffect(() => {
    if (!isAdmin || !supabaseClient) { setLoading(false); return; }
    let cancelled = false;
    async function load() {
      setLoading(true);
      setError(null);
      const [{ data: convos, error: convoErr }, { data: msgs, error: msgErr }] = await Promise.all([
        supabaseClient.from("conversations").select("id, user_id"),
        supabaseClient.from("messages").select("id, attachments, created_at, conversation_id")
          .eq("role", "user").not("attachments", "is", null)
          .order("created_at", { ascending: false }).limit(200),
      ]);
      if (cancelled) return;
      if (convoErr || msgErr) {
        setError((convoErr || msgErr).message);
        setLoading(false);
        return;
      }
      const userByConvo = Object.fromEntries((convos || []).map((c) => [c.id, c.user_id]));
      const found = [];
      (msgs || []).forEach((m) => {
        (m.attachments || []).forEach((a, i) => {
          if (a?.mimeType?.startsWith("image/") && a?.dataUrl) {
            found.push({
              id: `${m.id}-${i}`,
              dataUrl: a.dataUrl,
              name: a.name,
              createdAt: m.created_at,
              userId: userByConvo[m.conversation_id] || null,
            });
          }
        });
      });
      setPhotos(found);
      setLoading(false);
    }
    load();
    return () => { cancelled = true; };
  }, [isAdmin]);

  if (!isAdmin) {
    return (
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "4rem 1.25rem", textAlign: "center" }}>
        <div className="mb-icon-badge" style={{ background: "var(--danger)", margin: "0 auto 1rem" }}>
          <ShieldCheck size={20} />
        </div>
        <h2 style={{ fontWeight: 800, marginBottom: "0.5rem" }}>Admins only</h2>
        <p style={{ color: "var(--text-muted)", fontSize: "0.9rem" }}>This page isn't available on your account.</p>
      </div>
    );
  }

  return (
    <div style={{ position: "relative", maxWidth: 1100, margin: "0 auto", padding: "2.5rem 1.25rem 4rem", zIndex: 1 }}>
      <h1 style={{ fontSize: "clamp(1.6rem, 3.5vw, 2.2rem)", fontWeight: 800, marginBottom: "0.4rem" }}>Photo gallery</h1>
      <p style={{ color: "var(--text-muted)", fontSize: "0.9rem", marginBottom: "1.75rem" }}>
        Every image attachment sent to Clarity across all conversations, newest first.
        {!loading && !error && ` ${photos.length} photo${photos.length === 1 ? "" : "s"}.`}
      </p>

      {loading && <p style={{ color: "var(--text-muted)", fontSize: "0.9rem" }}>Loading…</p>}
      {error && (
        <p style={{ color: "var(--danger)", fontSize: "0.9rem" }}>
          Couldn't load photos: {error}. If this is your first time here, make sure the admin RLS policies have been
          added in Supabase (see setup notes).
        </p>
      )}
      {!loading && !error && photos.length === 0 && (
        <p style={{ color: "var(--text-muted)", fontSize: "0.9rem" }}>No photo attachments yet.</p>
      )}

      {!loading && photos.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, 150px)", gap: "0.9rem" }}>
          {photos.map((p) => (
            <button
              key={p.id}
              onClick={() => setActive(p)}
              style={{ padding: 0, border: "1px solid var(--border)", borderRadius: 14, overflow: "hidden", cursor: "pointer", background: "var(--card)", aspectRatio: "1", display: "block" }}
              aria-label={`Open photo from ${new Date(p.createdAt).toLocaleString()}`}
            >
              <img src={p.dataUrl} alt={p.name || "Attachment"} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
            </button>
          ))}
        </div>
      )}

      {active && (
        <div
          onClick={() => setActive(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.75)", backdropFilter: "blur(4px)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: "1.5rem", cursor: "zoom-out" }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ maxWidth: 640, width: "100%" }}>
            <img src={active.dataUrl} alt={active.name || "Attachment"} style={{ width: "100%", borderRadius: 16, display: "block", boxShadow: "0 30px 60px -20px rgba(0,0,0,0.5)" }} />
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "0.8rem" }}>
              <p style={{ color: "#fff", fontSize: "0.82rem" }}>
                {new Date(active.createdAt).toLocaleString()} · user {active.userId ? active.userId.slice(0, 8) : "unknown"}
              </p>
              <button onClick={() => setActive(null)} className="mb-btn subtle" style={{ background: "rgba(255,255,255,0.12)", color: "#fff", borderColor: "rgba(255,255,255,0.3)" }}>
                <X size={14} /> Close
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
