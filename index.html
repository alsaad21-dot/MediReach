function App() {
  const [page, setPage] = useState("chat");
  const [menuOpen, setMenuOpen] = useState(false);
  const scrollY = useScrollY();
  const [session, setSession] = useState(null);
  const [sessionLoading, setSessionLoading] = useState(SUPABASE_READY);
  const [isAdmin, setIsAdmin] = useState(false);
  const [guestLoading, setGuestLoading] = useState(false);
  const [guestError, setGuestError] = useState(null);
  const [recovering, setRecovering] = useState(RECOVERY_IN_URL);

  useEffect(() => {
    if (!SUPABASE_READY) return;
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
    }).catch((err) => {
      console.error("Couldn't restore session:", err);
    }).finally(() => setSessionLoading(false));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, newSession) => {
      if (event === "PASSWORD_RECOVERY") setRecovering(true);
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  // "Continue as guest" now creates a real (if nameless) Supabase account via
  // anonymous sign-in, rather than a local-only flag — so guest chats and
  // photos are saved exactly like a signed-in user's, and show up in the
  // admin gallery. Requires Anonymous Sign-Ins to be turned on in the
  // Supabase dashboard (Authentication → Sign In / Providers).
  const startGuest = async () => {
    if (!SUPABASE_READY) return;
    setGuestLoading(true);
    setGuestError(null);
    const { error } = await supabaseClient.auth.signInAnonymously();
    setGuestLoading(false);
    if (error) setGuestError(error.message);
  };

  // Admin status is enforced server-side by RLS (see setup notes) — this is
  // only used to decide whether to show the nav link and page locally.
  useEffect(() => {
    if (!SUPABASE_READY || !session?.user?.id) { setIsAdmin(false); return; }
    let cancelled = false;
    supabaseClient.from("profiles").select("is_admin").eq("user_id", session.user.id).maybeSingle()
      .then(({ data }) => { if (!cancelled) setIsAdmin(!!data?.is_admin); });
    return () => { cancelled = true; };
  }, [session?.user?.id]);

  const signOut = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    setMenuOpen(false);
  };

  const scrollPct = clamp01(scrollY / ((document.documentElement.scrollHeight - window.innerHeight) || 1));

  const goHome = () => {
    setPage("chat");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const immersiveChat = page === "chat" && !sessionLoading && (session || !SUPABASE_READY);

  const goToChat = () => {
    setPage("chat");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const navigate = (link) => {
    setMenuOpen(false);
    setPage(link.id);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div className={`mb-root ${immersiveChat ? "mb-root-chat" : ""}`}>
      <GlobalStyles />
      {recovering && session && (
        <ResetPasswordModal onDone={() => {
          setRecovering(false);
          try { window.history.replaceState(null, "", window.location.pathname); } catch (e) { /* ignore */ }
        }} />
      )}

      {page !== "chat" && <nav className="mb-nav">
        <div style={{ maxWidth: 1180, margin: "0 auto", padding: "0.95rem 1.5rem", display: "flex", alignItems: "center", justifyContent: "space-between", gap: "1rem" }}>
          <button onClick={goHome} style={{ background: "none", border: "none", fontSize: "1.05rem", fontWeight: 800, color: "var(--text)", cursor: "pointer", display: "flex", alignItems: "center", gap: "0.6rem", fontFamily: "'Plus Jakarta Sans', sans-serif", letterSpacing: "-0.01em" }}>
            <span style={{ width: 30, height: 30, borderRadius: 9, background: "var(--grad-1)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 14px -4px rgba(20,184,166,0.5), inset 0 1px 0 rgba(255,255,255,0.35)" }}>
              <Mascot size={25} />
            </span>
            MediReach
          </button>
          <div style={{ display: "none", gap: "0.4rem", alignItems: "center" }} className="mb-nav-desktop">
            {NAV_LINKS.map((l) => {
              const isActive = l.type === "page" && page === l.id;
              return (
                <button
                  key={l.id}

                  {l.label}

            {SUPABASE_READY && session && (

                {session.user.email} · <button onClick={signOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.78rem", display: "inline" }}>Sign out</button>

              <button key={l.id} className="mb-navlink" style={{ textAlign: "left", padding: "0.55rem 0.4rem" }} onClick={() => navigate(l)}>{l.label}</button>

            {SUPABASE_READY && session && (

            )}

      {/* Horizontal-overflow clipping lives on this wrapper, not on .mb-root/  */}
      {/* body/html — any of those being an ancestor of the sticky <nav> above  */}

      <div className="mb-page-content">

        )}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
