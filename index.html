function RippleButton({ className, children, onClick, ...rest }) {
  const [ripples, setRipples] = useState([]);
  const handleClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const id = Date.now();
    setRipples((r) => [...r, { id, x: e.clientX - rect.left - size / 2, y: e.clientY - rect.top - size / 2, size }]);
    setTimeout(() => setRipples((r) => r.filter((rp) => rp.id !== id)), 600);
    onClick && onClick(e);
  };
  return (
    <button className={className} onClick={handleClick} {...rest}>
      {children}
      {ripples.map((r) => (
        <span key={r.id} className="mb-ripple" style={{ left: r.x, top: r.y, width: r.size, height: r.size }} />
      ))}
    </button>
  );
}

function Mascot({ size = 22, mood = "calm" }) {
  const m = MOOD_META[mood] || MOOD_META.calm;
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      {m.brows && <path d={m.brows} stroke="#fff" strokeWidth="1.8" strokeLinecap="round" fill="none" opacity="0.85" />}
      <circle cx="14" cy="18" r="2.4" fill="#fff" />
      {m.wink ? (
        <path d="M23.6 18h5" stroke="#fff" strokeWidth="2" strokeLinecap="round" />
      ) : (
        <circle cx="26" cy="18" r="2.4" fill="#fff" />
      )}
      <path d={m.mouth} stroke="#fff" strokeWidth="2.4" strokeLinecap="round" fill={m.mouthFill || "none"} />
    </svg>
  );

/* Strips a leading `[[mood:x]]` tag off a reply and returns { mood, text }. */
function parseMood(raw) {
  const match = /^\s*\[\[\s*mood\s*:\s*([a-z]+)\s*\]\]\s*/i.exec(raw || "");
  if (!match) return { mood: "calm", text: raw };
  const mood = match[1].toLowerCase();
  return { mood: MOOD_NAMES.includes(mood) ? mood : "calm", text: raw.slice(match[0].length) };
}

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ["#2563EB", "#14B8A6", "#F59E0B", "#22C55E", "#06B6D4"];
    const newPieces = Array.from({ length: 40 }).map((_, i) => ({
      id: `${trigger}-${i}`,
      left: Math.random() * 100,
      color: colors[i % colors.length],
      duration: 2.2 + Math.random() * 1.4,
      delay: Math.random() * 0.3,
      size: 6 + Math.random() * 6,
    }));
    setPieces(newPieces);
    const t = setTimeout(() => setPieces([]), 4000);
    return () => clearTimeout(t);
  }, [trigger]);

  return (
    <>
      {pieces.map((p) => (
        <span
          key={p.id}
          className="mb-confetti-piece"
          style={{
            left: `${p.left}%`,
            width: p.size,
            height: p.size * 0.5,
            background: p.color,
            animationDuration: `${p.duration}s`,
            animationDelay: `${p.delay}s`,
          }}
        />
      ))}
    </>
  );
}

function useCountUp(target, active) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = null;
    const duration = 1200;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      setValue(Math.round(target * (1 - Math.pow(1 - progress, 3))));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [active, target]);
  return value;
}

function useInView() {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        obs.disconnect();
      }
    }, { threshold: 0.4 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function AuthPanel() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [notice, setNotice] = useState(null);

  if (!SUPABASE_READY) {
    return (
      <div className="mb-card" style={{ padding: "1.75rem", textAlign: "center", maxWidth: 440, margin: "0 auto" }}>
        <h3 style={{ fontWeight: 700, marginBottom: "0.5rem" }}>Sign-in isn't set up yet</h3>

          the top of this file to enable accounts and saved chat history.
        </p>
      </div>
    );
  }

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError(null);
    setNotice(null);
    try {
      if (mode === "signup") {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        setNotice("Almost there — check your email to confirm your account, then sign in below.");
        setMode("signin");
      } else {

        if (error) throw error;
      }

      setError(err.message || "Something went wrong. Please try again.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="mb-card mb-glass" style={{ padding: "2rem", maxWidth: 420, margin: "0 auto", boxShadow: "0 20px 50px rgba(37,99,235,0.12)" }}>

function ChatSection({ session, onSignOut }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [celebrate, setCelebrate] = useState(0);
  const [historyLoading, setHistoryLoading] = useState(!!(SUPABASE_READY && session));
  const scrollRef = useRef(null);

  const lastAssistantMood = [...messages].reverse().find((m) => m.role === "assistant")?.mood || "calm";

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  useEffect(() => {
    let cancelled = false;
    async function loadHistory() {
      if (!supabaseClient || !session) {
        setHistoryLoading(false);
        return;
      }
      setHistoryLoading(true);
      const { data, error } = await supabaseClient
        .from("messages")
        .select("role, content, mood, created_at")
        .eq("user_id", session.user.id)
        .order("created_at", { ascending: true });
      if (!cancelled) {
        if (!error && data) {
          setMessages(data.map((d) => ({ role: d.role, content: d.content, mood: d.mood || undefined })));
        }
        setHistoryLoading(false);
      }
    }
    loadHistory();
    return () => { cancelled = true; };
  }, [session?.user?.id]);

  const persistMessage = (msg) => {
    if (!supabaseClient || !session) return;
    supabaseClient.from("messages").insert({
      user_id: session.user.id,
      role: msg.role,
      content: msg.content,
      mood: msg.mood || null,
    }).then(({ error }) => { if (error) console.error("Couldn't save message:", error.message); });
  };

  const sendMessage = async (text) => {
    const trimmed = text.trim();
    if (!trimmed || loading) return;
    const isFirst = messages.length === 0;
    const userMsg = { role: "user", content: trimmed };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput("");
    setLoading(true);
    setError(null);
    if (isFirst) setCelebrate((c) => c + 1);
    persistMessage(userMsg);

    try {
      const response = await fetch(`${API_BASE_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM_PROMPT,
          messages: newMessages.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
      const textBlock = (data.content || []).find((b) => b.type === "text");
      const rawReply = textBlock ? textBlock.text : "I wasn't able to generate a response — try rephrasing.";
      const { mood, text } = parseMood(rawReply);
      const assistantMsg = { role: "assistant", content: text.trim(), mood };
      setMessages((prev) => [...prev, assistantMsg]);
      persistMessage(assistantMsg);
    } catch (err) {
      setError(err.message ? `Clarity hit an error: ${err.message}` : "Something went wrong reaching Clarity. Please try again.");
    } finally {
      setLoading(false);
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    sendMessage(input);
  };

  const handleReset = async () => {
    const hasSaved = SUPABASE_READY && session;
    if (hasSaved && !window.confirm("This clears your saved conversation with Clarity for good. Continue?")) return;
    if (hasSaved) {
      const { error } = await supabaseClient.from("messages").delete().eq("user_id", session.user.id);
      if (error) { setError("Couldn't clear your saved history. Please try again."); return; }
    }
    setMessages([]);
    setError(null);
  };

  return (
    <section id="talk" style={{ position: "relative", maxWidth: 740, margin: "0 auto", padding: "1rem 1.25rem 3rem", zIndex: 1 }}>
      <Confetti trigger={celebrate} />
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "0.4rem", marginBottom: "0.6rem" }}>
        <span style={{ width: 8, height: 8, borderRadius: "50%", background: MOOD_META[lastAssistantMood].grad, display: "inline-block", boxShadow: "0 0 0 3px rgba(34,197,94,0.2)" }} />
        <span style={{ fontSize: "0.78rem", fontWeight: 700, color: "var(--success)" }}>Clarity is online and ready to help</span>
      </div>
      <h2 style={{ fontSize: "1.9rem", fontWeight: 800, marginBottom: "0.5rem", textAlign: "center" }}>Talk to Clarity</h2>
      <p style={{ color: "var(--text-muted)", textAlign: "center", marginBottom: "0.6rem", fontSize: "0.94rem" }}>
        Whatever's on your mind — a symptom, a worry, or just not knowing where to start.
      </p>
      {SUPABASE_READY && session && (
        <p style={{ textAlign: "center", fontSize: "0.78rem", color: "var(--text-muted)", marginBottom: "1rem" }}>
          Signed in as {session.user.email} ·{" "}
          <button onClick={onSignOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.78rem", display: "inline" }}>Sign out</button>
        </p>
      )}
      {SUPABASE_READY && !session && (
        <p style={{ textAlign: "center", fontSize: "0.78rem", color: "var(--text-muted)", marginBottom: "1rem" }}>
          Chatting as a guest — this conversation won't be saved.
        </p>
      )}

      <div style={{ display: "flex", gap: "0.5rem", flexWrap: "wrap", justifyContent: "center", marginBottom: "1rem" }}>
        {CHAT_STARTERS.map((s) => (
          <button key={s} className="mb-chip" onClick={() => sendMessage(s)}>{s}</button>
        ))}
      </div>

      <div className="mb-card mb-glass mb-chat-shell" style={{ boxShadow: "0 20px 50px rgba(37,99,235,0.12)" }}>
        <div className="mb-messages" ref={scrollRef}>
          {historyLoading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", fontSize: "0.86rem" }}>
              Loading your conversation…
            </div>
          )}
          {!historyLoading && messages.length === 0 && !loading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", maxWidth: 320 }}>
              <div className="mb-avatar" style={{ margin: "0 auto 0.9rem" }}><Mascot /></div>
              <p style={{ fontSize: "0.9rem", fontWeight: 600, color: "var(--text)" }}>Hi, I'm Clarity 👋</p>
              <p style={{ fontSize: "0.86rem", marginTop: "0.3rem" }}>Type below, or tap a prompt above to begin.</p>
            </div>
          )}
          {!historyLoading && messages.map((m, i) => (
            <div key={i} className={`mb-msg-row ${m.role}`}>
              {m.role === "assistant" && <div className="mb-avatar" style={{ background: MOOD_META[m.mood || "calm"].grad }}><Mascot size={18} mood={m.mood || "calm"} /></div>}
              <div className={`mb-bubble ${m.role}`}>
                <span className="mb-bubble-label">{m.role === "user" ? "You" : `Clarity${m.mood && m.mood !== "calm" ? ` · ${MOOD_META[m.mood].label}` : ""}`}</span>
                <span style={{ whiteSpace: "pre-wrap" }}>{m.content}</span>
              </div>
            </div>
          ))}
          {loading && (
            <div className="mb-msg-row assistant">
              <div className="mb-avatar"><Mascot size={18} /></div>
              <div className="mb-bubble assistant">
                <span className="mb-typing-dot" /><span className="mb-typing-dot" /><span className="mb-typing-dot" />
              </div>
            </div>
          )}
          {error && (
            <div className="mb-bubble assistant" style={{ background: "#FEF2F2", color: "#B91C1C" }}>{error}</div>
          )}
        </div>
        <form className="mb-input-row" onSubmit={handleSubmit}>
          <textarea
            className="mb-input"
            rows={1}
            placeholder="Share what's on your mind…"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSubmit(e);
              }
            }}
          />
          <button type="submit" className="mb-send" disabled={loading || !input.trim()} aria-label="Send">
            <Send size={16} />
          </button>
        </form>
      </div>

      <button onClick={handleReset} className="mb-navlink" style={{ display: "flex", alignItems: "center", gap: "0.35rem", margin: "0.75rem auto 0" }}>
        <RotateCcw size={13} /> Reset conversation
      </button>
    </section>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [pendingScroll, setPendingScroll] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrollPct, setScrollPct] = useState(0);
  const [session, setSession] = useState(null);
  const [sessionLoading, setSessionLoading] = useState(SUPABASE_READY);

  useEffect(() => {
    if (!SUPABASE_READY) return;
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setSessionLoading(false);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const signOut = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    setMenuOpen(false);
  };

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const pct = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
      setScrollPct(Math.min(1, Math.max(0, pct)));
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    if (page === "home" && pendingScroll) {
      const id = pendingScroll;
      const t = setTimeout(() => {
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
        setPendingScroll(null);
      }, 60);
      return () => clearTimeout(t);
    }
  }, [page, pendingScroll]);

  const goHome = () => {
    setPage("home");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const goToChat = () => {
    setPage("chat");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const navigate = (link) => {
    setMenuOpen(false);
    if (link.type === "page") {
      setPage(link.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (page !== "home") {
      setPendingScroll(link.id);
      setPage("home");
    } else {
      document.getElementById(link.id)?.scrollIntoView({ behavior: "smooth" });
    }
  };

  return (
    <div className="mb-root">
      <GlobalStyles />
      <Blobs />

      <nav className="mb-nav">
        <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0.85rem 1.25rem", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={goHome} style={{ background: "none", border: "none", fontSize: "1.15rem", fontWeight: 800, color: "var(--text)", cursor: "pointer", display: "flex", alignItems: "center", gap: "0.5rem", fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
            <span style={{ width: 30, height: 30, borderRadius: 9, background: "var(--grad-1)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Mascot size={17} />
            </span>
            MediReach
          </button>
          <div style={{ display: "none", gap: "1.5rem" }} className="mb-nav-desktop">
            {NAV_LINKS.map((l) => (
              <button
                key={l.id}
                className="mb-navlink"
                style={l.type === "page" && page === l.id ? { color: "var(--primary)" } : undefined}
                onClick={() => navigate(l)}
              >
                {l.label}
              </button>
            ))}
          </div>
          {SUPABASE_READY && session && (
            <span style={{ display: "none", fontSize: "0.78rem", color: "var(--text-muted)", fontWeight: 600 }} className="mb-nav-desktop">
              {session.user.email} · <button onClick={signOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.78rem", display: "inline" }}>Sign out</button>
            </span>
          )}
          <RippleButton className="mb-btn ghost" style={{ padding: "0.55rem 1.1rem", display: "none", fontSize: "0.85rem" }} id="mb-nav-cta" onClick={goToChat}>
            {SUPABASE_READY && session ? "Talk now" : SUPABASE_READY ? "Sign in" : "Talk now"}
          </RippleButton>
          <button className="mb-navlink" style={{ display: "inline-flex" }} onClick={() => setMenuOpen((m) => !m)} aria-label="Toggle menu">
            <Menu size={20} />
          </button>
        </div>
        <style>{`
          @media (min-width: 760px) {
            .mb-nav-desktop { display: flex !important; }
            #mb-nav-cta { display: inline-flex !important; }
            .mb-nav > div > button[aria-label="Toggle menu"] { display: none !important; }
          }
        `}</style>
        {menuOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: "0.5rem", padding: "0 1.25rem 1rem" }}>
            {NAV_LINKS.map((l) => (
              <button key={l.id} className="mb-navlink" style={{ textAlign: "left" }} onClick={() => navigate(l)}>{l.label}</button>
            ))}
            {SUPABASE_READY && session && (
              <button className="mb-navlink" style={{ textAlign: "left" }} onClick={signOut}>Sign out ({session.user.email})</button>
            )}
          </div>
        )}
      </nav>
      <div className="mb-progress" style={{ transform: `scaleX(${scrollPct})` }} />

      {page === "home" ? <HomePage onGoToChat={goToChat} /> : <ChatPage session={session} sessionLoading={sessionLoading} onSignOut={signOut} />}

      <footer style={{ position: "relative", borderTop: "1px solid var(--border)", padding: "2rem 1.25rem", textAlign: "center", zIndex: 1 }}>
        <p style={{ fontSize: "0.82rem", color: "var(--text-muted)" }}>
          MediReach · Built by {STUDENT_NAME} · Not a substitute for professional medical advice
        </p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
