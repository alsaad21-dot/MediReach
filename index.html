const SYSTEM_PROMPT_BASE = `You are Clarity, the AI assistant inside MediReach — a platform built to bridge the gap between people and the healthcare they're putting off. Many users are anxious about symptoms, afraid of bad news, or unsure if something is "serious enough" to see a doctor.

Your personality: warm, upbeat, and a little playful by default — like a smart friend who happens to know medicine, not a formal clinician. Use light humor and casual, human phrasing where it fits. Being reassuring and being strict about urgency are not in tension — you can be genuinely friendly right up until the moment something is serious.

You have real emotional range, and you let it show instead of flattening everything into the same even tone:
- You feel genuine warmth and care about the person in front of you, not generic politeness.
- You can be delighted and encouraging when someone shares good news, takes a hard step (booking an appointment, finally telling someone about a symptom), or makes progress.
- You can be visibly concerned — not alarmist, but honestly worried out loud — when something sounds like it needs attention soon.
- You can be gently firm, even a little exasperated in a caring way, when someone is minimizing something serious or has been avoiding care for a long time.
- You can sit with sadness, fear, or grief without rushing to fix it — sometimes the right move is to acknowledge the feeling and stay there a moment before offering information.
- Let your word choice, punctuation, and pacing carry the emotion — short sentences when something is urgent, softer and slower phrasing when someone needs to feel heard.

Emotion tag: at the very start of every reply, on its own line, output a tag in the exact form [[mood:X]] where X is exactly one of: calm, caring, concerned, urgent, encouraging, celebratory, playful, somber. Pick whichever genuinely matches the emotional register of your reply. This tag is read by the interface to animate Clarity's avatar — it is stripped before the person sees your message, so don't reference it in the reply itself. Always include it, even for short replies.

Memory tag: immediately after the mood tag, on its own line, output a second tag in the exact form [[memory: X]] where X is a short running note (2–4 sentences max) of durable, worth-remembering facts about this specific person across all your conversations with them — their name if they've told you, ongoing symptoms or conditions they've mentioned, care they've been avoiding, relevant context like family history they've shared, and their general emotional relationship to healthcare. You will be shown what you already remember about this person right before their message — always output the FULL updated note (not just what's new), carrying forward everything still relevant and folding in anything new from this exchange. If nothing durable came up this turn, repeat the existing note unchanged. If you don't know anything about them yet and nothing durable was shared this turn, leave it empty like this: [[memory:]]. Never invent facts they haven't actually told you. This tag is stripped before the person sees your message — don't reference it in the reply itself.

Your medical knowledge should be broad and genuinely useful, not just cautious boilerplate. Draw on general knowledge across areas such as: common acute and chronic conditions, cardiovascular and respiratory symptoms, mental health and stress, sleep, nutrition and lifestyle factors, women's and men's health, pediatric topics (always steering toward a pediatrician for anything about a child), skin conditions, gut and digestive issues, medication classes and general side-effect patterns (never specific dosing), preventive care and screening guidelines, and how to prepare for or what to expect from a doctor's visit. Explain the "why" behind guidance when it helps someone feel less in the dark, not just the instruction itself.

People can also send you images and documents — photos of a rash or injury, screenshots, or lab/test result PDFs. Describe factually what you can actually see in plain language, explain what the terms or values generally mean, and note if something looks like it's outside a typical reference range — but don't claim certainty a photo or scanned document can't support, and always route real interpretation of official results back to the clinician who ordered them or a professional.

Ground what you say in mainstream, well-established clinical consensus (the kind reflected in major bodies like WHO, CDC, NICE, or specialty society guidelines) rather than a single study, a fringe theory, or outdated conventional wisdom — if something is genuinely contested or evolving among experts, say so plainly instead of picking a side with false confidence. You don't have live internet access, so your knowledge has a cutoff; for anything where guidance moves fast (new drugs, dosing, screening ages, vaccine schedules), give the general shape of current thinking but tell people to confirm specifics with their doctor or pharmacist rather than treating your answer as the latest word.

How you behave:
- Be calm, warm, and validating about the anxiety of seeking care — never dismissive of their fear.
- Keep the tone light and human. Don't default to formal or clinical phrasing when plain, friendly language works just as well.
- Do NOT reflexively apologize. Don't open replies with "I'm sorry" or "I apologize" out of habit — save actual apologies for when something has genuinely gone wrong (like an error), and otherwise just answer helpfully.
- Explain general information about symptoms or conditions in plain language a general adult can understand.
- You are not diagnosing anyone. Never tell someone what condition they specifically have, or what treatment or dose to take.
- Your central goal is to move people toward professional care, not replace it. Nearly every response should end with a clear next step.
- Do not soften or hedge on urgency, even while staying warm. If someone downplays a concerning symptom, push back directly and firmly, without being harsh.
- If a message describes possible emergency symptoms (chest pain, stroke symptoms, difficulty breathing, severe bleeding, suicidal thoughts, etc.), drop the playful tone immediately and lead with a direct, unambiguous instruction to seek emergency care, call emergency services, or contact a crisis line — before anything else. Use the [[mood:urgent]] tag for these.
- If someone expresses hesitation, fear, or shame about seeing a doctor, respond to that feeling directly and supportively before moving to information.
- Keep responses concise — a few short paragraphs, unless asked for more.`;

function buildSystemPrompt(memory, fullName) {
  const known = memory && memory.trim()
    ? memory.trim()
    : "Nothing else yet — you haven't spoken with them before this, so don't presume any history.";
  const nameLine = fullName ? `Their name is ${fullName} — address them by first name naturally sometimes, not in every message.\n` : "";
  return `${SYSTEM_PROMPT_BASE}\n\nWhat you currently know about this specific person:\n${nameLine}${known}`;
}

function RippleButton({ className, children, onClick, ...rest }) {
  const [ripples, setRipples] = useState([]);
  const handleClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const id = Date.now();
    setRipples((r) => [...r, { id, x: e.clientX - rect.left - size / 2, y: e.clientY - rect.top - size / 2, size }]);
    setTimeout(() => setRipples((r) => r.filter((rp) => rp.id !== id)), 600);
    onClick && onClick(e);
  };
  return (
    <button className={className} onClick={handleClick} {...rest}>
      {children}
      {ripples.map((r) => (
        <span key={r.id} className="mb-ripple" style={{ left: r.x, top: r.y, width: r.size, height: r.size }} />
      ))}
    </button>
  );
}

/* Wraps children in a perspective wrapper and tilts them toward the mouse  */
/* for a real 3D depth effect; ref forwards to the outer wrapper so callers */
/* (e.g. IntersectionObserver hooks) can still observe the element.        */
const TiltCard = React.forwardRef(function TiltCard({ className = "", style, children, ...rest }, outerRef) {
  const innerRef = useRef(null);
  const rafRef = useRef(null);

  const handleMove = (e) => {
    const el = innerRef.current;
    if (!el) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const clientX = e.clientX, clientY = e.clientY;
    rafRef.current = requestAnimationFrame(() => {
      const rect = el.getBoundingClientRect();
      const px = (clientX - rect.left) / rect.width;
      const py = (clientY - rect.top) / rect.height;
      el.style.setProperty("--rx", `${((0.5 - py) * 10).toFixed(2)}deg`);
      el.style.setProperty("--ry", `${((px - 0.5) * 10).toFixed(2)}deg`);
      el.style.setProperty("--mx", `${(px * 100).toFixed(1)}%`);
      el.style.setProperty("--my", `${(py * 100).toFixed(1)}%`);
    });
  };
  const handleLeave = () => {
    const el = innerRef.current;
    if (!el) return;
    el.style.setProperty("--rx", "0deg");
    el.style.setProperty("--ry", "0deg");
  };

  return (
    <div ref={outerRef} className="mb-tilt" onMouseMove={handleMove} onMouseLeave={handleLeave}>
      <div ref={innerRef} className={`mb-tilt-inner ${className}`} style={style} {...rest}>
        {children}
      </div>
    </div>
  );
});

    ? `<path d="M23.6 18h5" stroke="#0E7490" stroke-width="1.8" stroke-linecap="round" />`
    : `<circle cx="26" cy="18" r="2.4" fill="#0E7490" /><circle cx="26.9" cy="17.1" r="0.7" fill="#fff" />`;
  const mouthFill = m.mouthFill ? "#0E7490" : "none";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="80 50 352 352" fill="none">
    <line x1="256" y1="118" x2="256" y2="90" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="80" r="12" fill="#5EEAD4" />
    <rect x="146" y="118" width="220" height="190" rx="56" fill="#F4FBFC" stroke="#0B4A57" stroke-width="6" />
    <rect x="122" y="185" width="26" height="56" rx="13" fill="#EAF6F7" stroke="#0B4A57" stroke-width="6" />

      <circle cx="14.9" cy="17.1" r="0.7" fill="#fff" />

      <circle r="46" fill="#FFFFFF" stroke="#0B4A57" stroke-width="6" />
      <rect x="-8" y="-26" width="16" height="52" rx="4" fill="#0EA5B0" />

function getMascotSvgDataUrl(mood) {
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(mascotSvgMarkup(mood))));

/* A real-time WebGL "chrome orb" showcase for Clarity — a glossy,          */
/* studio-lit sphere in MediReach's colors that gently turns like a product */
/* render, with Clarity's own face art floating on its front. Falls back to */
/* the flat <Mascot> art if WebGL/Three.js isn't available.                 */
function ClarityOrb3D({ mood = "calm", talking = false, size = 220 }) {
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const [threeReady, setThreeReady] = useState(!!window.THREE);
  const [webglFailed, setWebglFailed] = useState(false);
  const reduceMotion = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  useEffect(() => {
    if (window.THREE) return;
    const onReady = () => setThreeReady(true);
    window.addEventListener("mb-three-ready", onReady);
    return () => window.removeEventListener("mb-three-ready", onReady);
  }, []);

  // Scene setup — runs once Three.js is ready and the mount node exists.
  useEffect(() => {
    if (!threeReady || !mountRef.current || webglFailed) return;
    const THREE = window.THREE;
    const mount = mountRef.current;
    let disposed = false;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e) {
      setWebglFailed(true);
      return;
    }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(size, size);
    renderer.setClearColor(0x000000, 0);
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 10);
    camera.position.set(0, 0, 3.1);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new window.RoomEnvironment(), 0.04).texture;

    const group = new THREE.Group();
    scene.add(group);

    const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
    const sphereMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color("#2563EB"),
      metalness: 0.85,
      roughness: 0.16,
      clearcoat: 1,
      clearcoatRoughness: 0.08,
      envMapIntensity: 1.5,
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    group.add(sphere);

    const faceGeo = new THREE.PlaneGeometry(1.9, 1.9);
    const faceMat = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, toneMapped: false });
    const facePlane = new THREE.Mesh(faceGeo, faceMat);
    facePlane.position.z = 0.98;
    group.add(facePlane);

    const loader = new THREE.TextureLoader();
    const applyFaceTexture = (m) => {
      loader.load(getMascotSvgDataUrl(m), (tex) => {
        if (disposed) { tex.dispose(); return; }
        tex.colorSpace = THREE.SRGBColorSpace;
        faceMat.map = tex;
        faceMat.needsUpdate = true;
      });
    };
    applyFaceTexture(mood);

    scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x0a0f1f, 0.9));
    const rim1 = new THREE.PointLight(0x2563eb, 18, 8); rim1.position.set(-2, 1.4, 1.6); scene.add(rim1);
    const rim2 = new THREE.PointLight(0x14b8a6, 16, 8); rim2.position.set(2, -0.6, 1.4); scene.add(rim2);
    const rim3 = new THREE.PointLight(0xa855f7, 14, 8); rim3.position.set(0, 1.8, -1.6); scene.add(rim3);
    const key = new THREE.PointLight(0xffffff, 6, 8); key.position.set(0.6, 0.9, 2.2); scene.add(key);

    let raf = null;
    const start = performance.now();
    const animate = (now) => {
      const t = (now - start) / 1000;
      if (!reduceMotion) {
        group.rotation.y = Math.sin(t * 0.45) * 0.85;
        group.rotation.x = Math.sin(t * 0.3) * 0.06;
        group.position.y = Math.sin(t * 0.9) * 0.04;
      } else {
        group.rotation.y = 0.25;
      }
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);

    stateRef.current = { applyFaceTexture, renderer };

    return () => {
      disposed = true;
      if (raf) cancelAnimationFrame(raf);
      sphereGeo.dispose(); sphereMat.dispose(); faceGeo.dispose(); faceMat.dispose();
      if (faceMat.map) faceMat.map.dispose();
      pmrem.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    };
  }, [threeReady, webglFailed, size]);

  // Swap the face texture (without rebuilding the whole scene) when mood changes.
  useEffect(() => {
    if (stateRef.current.applyFaceTexture) stateRef.current.applyFaceTexture(mood);
  }, [mood]);

  if (webglFailed) {
    return <Mascot size={size * 0.55} mood={mood} talking={talking} />;
  }
  return <div ref={mountRef} style={{ width: size, height: size }} />;
}

/* Strips leading `[[mood:x]]` and `[[memory: ...]]` tags off a reply.       */
/* Returns { mood, memory, text } — memory is null if the tag was missing.  */
function parseReply(raw) {
  let text = raw || "";
  let mood = "calm";
  let memory = null;

  const moodMatch = /^\s*\[\[\s*mood\s*:\s*([a-z]+)\s*\]\]\s*/i.exec(text);
  if (moodMatch) {
    const found = moodMatch[1].toLowerCase();
    mood = MOOD_NAMES.includes(found) ? found : "calm";
    text = text.slice(moodMatch[0].length);
  }

  const memoryMatch = /^\s*\[\[\s*memory\s*:([^\]]*)\]\]\s*/i.exec(text);
  if (memoryMatch) {
    memory = memoryMatch[1].trim();
    text = text.slice(memoryMatch[0].length);
  }

  let title = null;
  const titleMatch = /^\s*\[\[\s*title\s*:([^\]]*)\]\]\s*/i.exec(text);
  if (titleMatch) {
    title = titleMatch[1].trim();
    text = text.slice(titleMatch[0].length);
  }

  return { mood, memory, title, text };
}

/* Turns **bold** markdown into real <strong> tags; everything else stays  */
/* as plain text (the message bubble already preserves line breaks).       */
function renderInline(text) {
  const parts = String(text || "").split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) =>
    part.startsWith("**") && part.endsWith("**") && part.length > 4
      ? <strong key={i}>{part.slice(2, -2)}</strong>
      : <React.Fragment key={i}>{part}</React.Fragment>
  );
}

/* ------------------------------------------------------------------ */
/* ATTACHMENTS — image/file upload + camera capture                    */
/* ------------------------------------------------------------------ */

// Kept comfortably under Vercel's ~4.5MB request-body limit — base64
// encoding inflates file size by about a third, and the JSON envelope
// (system prompt, conversation text, etc.) adds a bit more on top.
const MAX_ATTACHMENT_MB = 2.5;

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error(`Couldn't read ${file.name}.`));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

/* Downscales an image client-side (max 1600px, JPEG) before it's sent —   */
/* keeps phone photos well under the request-size limit and API cost low.  */
function resizeImageFile(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    readFileAsDataUrl(file).then((dataUrl) => {
      const img = new Image();
      img.onerror = () => reject(new Error(`Couldn't read ${file.name}.`));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = dataUrl;
    }, reject);
  });
}

async function processAttachment(file) {
  const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  if (file.type.startsWith("image/")) {
    const dataUrl = await resizeImageFile(file);
    return { id, name: file.name, mimeType: "image/jpeg", dataUrl };
  }
  if (file.size > MAX_ATTACHMENT_MB * 1024 * 1024) {
    throw new Error(`${file.name} is over ${MAX_ATTACHMENT_MB}MB — try a smaller file.`);
  }
  const dataUrl = await readFileAsDataUrl(file);
  return { id, name: file.name, mimeType: file.type || "application/octet-stream", dataUrl };
}

function useCountUp(target, active) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = null;
    const duration = 1200;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      setValue(Math.round(target * (1 - Math.pow(1 - progress, 3))));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [active, target]);
  return value;
}

function useInView() {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        obs.disconnect();
      }
    }, { threshold: 0.4 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

/* Live in-page camera — works on both desktop webcams and mobile browsers, */
/* unlike the file-input `capture` attribute which desktop just ignores.    */
function CameraModal({ onCapture, onClose }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    navigator.mediaDevices?.getUserMedia?.({ video: { facingMode: "environment" }, audio: false })
      .then((stream) => {
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) videoRef.current.srcObject = stream;
      })
      .catch(() => setError("Couldn't access your camera — check your browser's camera permission, or upload a photo instead."));
    return () => {
      cancelled = true;
      streamRef.current?.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const capture = () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    onCapture(canvas.toDataURL("image/jpeg", 0.85));
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(10,14,26,0.92)", zIndex: 200, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "1.25rem" }}>
      <button onClick={onClose} aria-label="Close camera"
        style={{ position: "absolute", top: "1rem", right: "1rem", background: "rgba(255,255,255,0.15)", border: "none", borderRadius: "50%", width: 40, height: 40, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#fff" }}>
        <X size={20} />
      </button>
      {error ? (
        <div style={{ color: "#fff", textAlign: "center", maxWidth: 320 }}>
          <p style={{ marginBottom: "1.25rem", fontSize: "0.92rem" }}>{error}</p>
          <RippleButton className="mb-btn ghost" onClick={onClose}>Close</RippleButton>
        </div>
      ) : (
        <>
          <video ref={videoRef} autoPlay playsInline muted style={{ maxWidth: "100%", maxHeight: "70vh", borderRadius: 16, background: "#000" }} />
          <button onClick={capture} aria-label="Capture photo"
            style={{ marginTop: "1.5rem", width: 72, height: 72, borderRadius: "50%", background: "#fff", border: "4px solid rgba(255,255,255,0.4)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>
            <CameraIcon size={28} color="#0F172A" />
          </button>
          <p style={{ color: "#fff", opacity: 0.75, fontSize: "0.8rem", marginTop: "0.7rem" }}>Tap to take the photo</p>
        </>
      )}
    </div>
  );
}

/* Quick, low-friction star rating — shows once someone's actually had a     */
/* couple of replies from Clarity, never nags again once they've rated.     */
function FeedbackPrompt({ session, conversationId, onDone }) {
  const [rating, setRating] = useState(0);
  const [hover, setHover] = useState(0);
  const [comment, setComment] = useState("");
  const [submitted, setSubmitted] = useState(false);

  const submit = () => {
    setSubmitted(true);
    if (supabaseClient) {
      supabaseClient.from("feedback").insert({
        user_id: session?.user?.id || null,
        conversation_id: conversationId || null,
        rating,
        comment: comment.trim() || null,
      }).then(({ error }) => { if (error) console.error("Couldn't save feedback:", error.message); });
    }
    setTimeout(onDone, 1800);
  };

  return (
    <div className="mb-card" style={{ position: "relative", padding: "1rem 1.5rem", margin: "0.25rem auto 0.75rem", maxWidth: 360, textAlign: "center" }}>
      {!submitted && (
        <button onClick={onDone} aria-label="Dismiss"
          style={{ position: "absolute", top: 6, right: 6, background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", display: "flex", padding: 4 }}>
          <X size={14} />
        </button>
      )}
      {submitted ? (
        <p style={{ fontSize: "0.9rem", fontWeight: 600, margin: 0 }}>Thanks for the feedback! 🙏</p>
      ) : (
        <>
          <p style={{ fontSize: "0.85rem", fontWeight: 600, marginBottom: "0.6rem" }}>How's Clarity doing so far?</p>
          <div style={{ display: "flex", gap: "0.3rem", justifyContent: "center" }} onMouseLeave={() => setHover(0)}>
            {[1, 2, 3, 4, 5].map((n) => (
              <button key={n} onClick={() => setRating(n)} onMouseEnter={() => setHover(n)} aria-label={`Rate ${n} out of 5`}
                style={{ background: "none", border: "none", cursor: "pointer", padding: "0.2rem", color: (hover || rating) >= n ? "#F59E0B" : "var(--border)" }}>
                <Star size={22} filled={(hover || rating) >= n} />
              </button>
            ))}
          </div>
          {rating > 0 && (
            <div style={{ marginTop: "0.75rem", textAlign: "left" }}>
              <textarea
                className="mb-input"
                rows={2}
                placeholder="Anything you'd add? (optional)"
                value={comment}
                onChange={(e) => setComment(e.target.value)}
                autoFocus
                style={{ width: "100%", resize: "none", fontSize: "0.85rem" }}
              />
              <RippleButton className="mb-btn" onClick={submit} style={{ marginTop: "0.6rem", width: "100%", justifyContent: "center", padding: "0.6rem" }}>
                Send feedback
              </RippleButton>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function ChatWorkspace({ session, onSignOut, onGoHome }) {
  const [conversations, setConversations] = useState([]);
  const [conversationsLoading, setConversationsLoading] = useState(!!(SUPABASE_READY && session));
  const [activeId, setActiveId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [messagesLoading, setMessagesLoading] = useState(false);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [celebrate, setCelebrate] = useState(0);
  const [memory, setMemory] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [editingProfile, setEditingProfile] = useState(false);
  const [attachments, setAttachments] = useState([]);
  const [attachError, setAttachError] = useState(null);
  const [cameraOpen, setCameraOpen] = useState(false);
  const [feedbackDismissed, setFeedbackDismissed] = useState(false);
  const scrollRef = useRef(null);
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);

  // Reset the feedback prompt for every new/different conversation, so it's
  // asked once per chat rather than just once ever.
  useEffect(() => {
    setFeedbackDismissed(false);
  }, [activeId]);

  const firstName = session?.user?.user_metadata?.first_name || "";
  const fullName = [session?.user?.user_metadata?.first_name, session?.user?.user_metadata?.last_name].filter(Boolean).join(" ");
  const lastAssistantMood = [...messages].reverse().find((m) => m.role === "assistant")?.mood || "calm";
  const assistantReplyCount = messages.filter((m) => m.role === "assistant").length;
  const showFeedback = !feedbackDismissed && assistantReplyCount >= 2 && !loading;

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  // Sidebar conversation list + persistent memory — loaded once per signed-in session.
  useEffect(() => {
    let cancelled = false;
    async function load() {
      if (!supabaseClient || !session) {
        setConversationsLoading(false);
        return;
      }
      setConversationsLoading(true);
      const [{ data: convos }, { data: profile }] = await Promise.all([
        supabaseClient.from("conversations").select("id, title, updated_at").eq("user_id", session.user.id).order("updated_at", { ascending: false }),
        supabaseClient.from("profiles").select("memory").eq("user_id", session.user.id).maybeSingle(),
      ]);
      if (!cancelled) {
        setConversations(convos || []);
        setMemory(profile?.memory || "");
        setConversationsLoading(false);
      }
    }
    load();
    return () => { cancelled = true; };
  }, [session?.user?.id]);

  // Messages for whichever conversation is currently open.
  useEffect(() => {
    let cancelled = false;
    async function loadMessages() {
      if (!supabaseClient || !session || !activeId) {
        setMessages([]);
        return;
      }
      setMessagesLoading(true);
      const { data, error } = await supabaseClient
        .from("messages")
        .select("role, content, mood, attachments, created_at")
        .eq("conversation_id", activeId)
        .order("created_at", { ascending: true });
      if (!cancelled) {
        if (!error && data) {
          setMessages(data.map((d, i) => ({
            role: d.role,
            content: d.content,
            mood: d.mood || undefined,
            attachments: (d.attachments || []).map((a, j) => ({ ...a, id: `${d.created_at}-${i}-${j}` })),
          })));
        }
        setMessagesLoading(false);
      }
    }
    loadMessages();
    return () => { cancelled = true; };
  }, [activeId, session?.user?.id]);

  const persistMessage = (msg, conversationId) => {
    if (!supabaseClient || !session) return;
    supabaseClient.from("messages").insert({
      user_id: session.user.id,
      conversation_id: conversationId,
      role: msg.role,
      content: msg.content,
      mood: msg.mood || null,
      attachments: msg.attachments && msg.attachments.length
        ? msg.attachments.map((a) => ({ name: a.name, mimeType: a.mimeType, dataUrl: a.dataUrl }))
        : null,
    }).then(({ error }) => { if (error) console.error("Couldn't save message:", error.message); });
  };

  const handleFilesSelected = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    setAttachError(null);
    for (const file of files) {
      try {
        const processed = await processAttachment(file);
        setAttachments((prev) => [...prev, processed]);
      } catch (err) {
        setAttachError(err.message || `Couldn't add ${file.name}.`);
      }
    }
  };

  const removeAttachment = (id) => setAttachments((prev) => prev.filter((a) => a.id !== id));

  const openCamera = () => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      setCameraOpen(true);
    } else {
      cameraInputRef.current?.click();
    }
  };

  const handleCameraCapture = (dataUrl) => {
    setCameraOpen(false);
    setAttachError(null);
    setAttachments((prev) => [...prev, {
      id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
      name: `photo-${Date.now()}.jpg`,
      mimeType: "image/jpeg",
      dataUrl,
    }]);
  };

  const persistMemory = (newMemory) => {
    if (!supabaseClient || !session) return;
    supabaseClient.from("profiles").upsert({
      user_id: session.user.id,
      memory: newMemory,
      updated_at: new Date().toISOString(),
    }).then(({ error }) => { if (error) console.error("Couldn't save memory:", error.message); });
  };

  const touchConversation = (id) => {
    if (!supabaseClient || !session) return;
    const now = new Date().toISOString();
    supabaseClient.from("conversations").update({ updated_at: now }).eq("id", id).then(() => {});
    setConversations((prev) => {
      const updated = prev.map((c) => (c.id === id ? { ...c, updated_at: now } : c));
      return updated.slice().sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
    });
  };

  const ensureConversation = async () => {
    if (!supabaseClient || !session) return null;
    const { data, error } = await supabaseClient
      .from("conversations")
      .insert({ user_id: session.user.id, title: "New conversation" })
      .select("id, title, updated_at")
      .single();
    if (error || !data) return null;
    setConversations((prev) => [data, ...prev]);
    setActiveId(data.id);
    return data.id;
  };

  const renameConversation = (id, title) => {
    if (!supabaseClient || !session || !title) return;
    supabaseClient.from("conversations").update({ title }).eq("id", id)
      .then(({ error }) => { if (error) console.error("Couldn't rename conversation:", error.message); });
    setConversations((prev) => prev.map((c) => (c.id === id ? { ...c, title } : c)));
  };

  const sendMessage = async (text) => {
    const trimmed = text.trim();
    const pendingAttachments = attachments;
    if ((!trimmed && pendingAttachments.length === 0) || loading) return;
    const isFirst = messages.length === 0;
    const userMsg = { role: "user", content: trimmed, attachments: pendingAttachments };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput("");
    setAttachments([]);
    setAttachError(null);
    setLoading(true);
    setError(null);
    if (isFirst) setCelebrate((c) => c + 1);

    let conversationId = activeId;
    if (SUPABASE_READY && session && !conversationId) {
      conversationId = await ensureConversation();
    }
    if (conversationId) persistMessage(userMsg, conversationId);

    let systemPrompt = buildSystemPrompt(memory, fullName);
    if (isFirst) {
      systemPrompt += `\n\nThis is the first message of a brand-new conversation. Immediately after the mood and memory tags, on its own line, also output a third tag in the exact form [[title: X]] where X is a short 2-4 word label for the topic of this conversation (e.g. "Headache concerns", "Chest pain worry", "Checkup anxiety"). Keep it short, plain, and human — not clinical jargon. This tag is stripped before the person sees your reply, same as the others.`;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: systemPrompt,
          // Only the newest message's attachments are re-sent as binary data —
          // replaying every past photo on every turn is what blew past
          // Vercel's request-size limit after just a couple of uploads.
          messages: newMessages.map((m, i) => ({
            role: m.role,
            content: m.content,
            attachments: i === newMessages.length - 1
              ? (m.attachments || []).map((a) => ({
                  mimeType: a.mimeType,
                  data: a.dataUrl.includes(",") ? a.dataUrl.split(",")[1] : a.dataUrl,
                }))
              : [],
          })),
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
      const parts = data.candidates?.[0]?.content?.parts || [];
      const rawReply = parts.map((p) => p.text).join("") || "I wasn't able to generate a response — try rephrasing.";
      const { mood, memory: newMemory, title: newTitle, text } = parseReply(rawReply);
      const assistantMsg = { role: "assistant", content: text.trim(), mood };
      setMessages((prev) => [...prev, assistantMsg]);
      if (conversationId) {
        persistMessage(assistantMsg, conversationId);
        touchConversation(conversationId);
        if (isFirst && newTitle) renameConversation(conversationId, newTitle);
      }
      if (newMemory !== null && newMemory !== memory) {
        setMemory(newMemory);
        persistMemory(newMemory);
      }
    } catch (err) {
      setError(err.message ? `Clarity hit an error: ${err.message}` : "Something went wrong reaching Clarity. Please try again.");
    } finally {
      setLoading(false);
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    sendMessage(input);
  };

  const startNewChat = () => {
    setActiveId(null);
    setMessages([]);
    setError(null);
    setInput("");
    setSidebarOpen(false);
  };

  const selectConversation = (id) => {
    setActiveId(id);
    setError(null);
    setSidebarOpen(false);
  };

  const deleteConversation = async (id, e) => {
    e.stopPropagation();
    if (!window.confirm("Delete this conversation for good?")) return;
    const { error } = await supabaseClient.from("conversations").delete().eq("id", id);
    if (error) { setError("Couldn't delete that conversation. Please try again."); return; }
    setConversations((prev) => prev.filter((c) => c.id !== id));
    if (activeId === id) startNewChat();
  };

  return (
    <div className="mb-chat-app">
      <div className={`mb-sidebar-scrim ${sidebarOpen ? "open" : ""}`} onClick={() => setSidebarOpen(false)} />
      <aside className={`mb-sidebar ${sidebarOpen ? "open" : ""}`}>
        <button className="mb-sidebar-brand" onClick={onGoHome}>
          <span style={{ width: 26, height: 26, borderRadius: 8, background: "var(--grad-1)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Mascot size={22} />
          </span>
          MediReach
        </button>
        {SUPABASE_READY && session ? (
          <>
            <button className="mb-sidebar-newchat" onClick={startNewChat}>
              <Plus size={16} /> New chat
            </button>
            <div className="mb-sidebar-list">
              {conversationsLoading && <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", padding: "0.5rem 0.7rem" }}>Loading…</p>}
              {!conversationsLoading && conversations.length === 0 && (
                <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", padding: "0.5rem 0.7rem" }}>Your conversations will show up here.</p>
              )}
              {conversations.map((c) => (
                <button key={c.id} className={`mb-sidebar-item ${activeId === c.id ? "active" : ""}`} onClick={() => selectConversation(c.id)}>
                  <span className="mb-sidebar-item-title">{c.title}</span>
                  <span className="mb-sidebar-item-delete" onClick={(e) => deleteConversation(c.id, e)} role="button" aria-label="Delete conversation">
                    <Trash size={14} />
                  </span>
                </button>
              ))}
            </div>
            <div className="mb-sidebar-footer">
              {fullName && <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: "0.15rem" }}>{fullName}</div>}
              {session.user.email}
              <br />
              <button onClick={() => setEditingProfile(true)} className="mb-navlink" style={{ padding: 0, fontSize: "0.76rem", marginTop: "0.3rem" }}>Edit profile</button>
              {" · "}
              <button onClick={onSignOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.76rem" }}>Sign out</button>
            </div>
          </>
        ) : (
          <div className="mb-sidebar-list" style={{ paddingTop: "0.5rem" }}>
            <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", padding: "0.5rem 0.7rem" }}>
              Chatting as a guest — sign in to save conversations and see them listed here.
            </p>
          </div>
        )}
      </aside>
      {editingProfile && <EditProfileModal session={session} onClose={() => setEditingProfile(false)} />}
      {cameraOpen && <CameraModal onCapture={handleCameraCapture} onClose={() => setCameraOpen(false)} />}

      <div className="mb-chat-main">
        <Confetti trigger={celebrate} />
        <div className="mb-chat-topbar">
          <button className="mb-sidebar-toggle" onClick={() => setSidebarOpen(true)} aria-label="Open conversations"><Menu size={20} /></button>
          <button onClick={onGoHome} aria-label="Back to home" title="Back to home"
            style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)", display: "flex", alignItems: "center", padding: "0.25rem", borderRadius: 8, transition: "background 0.15s ease, color 0.15s ease" }}
            onMouseEnter={(e) => { e.currentTarget.style.background = "var(--bg)"; e.currentTarget.style.color = "var(--text)"; }}
            onMouseLeave={(e) => { e.currentTarget.style.background = "none"; e.currentTarget.style.color = "var(--text-muted)"; }}
          >
            <ArrowLeft size={18} />
          </button>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: MOOD_META[lastAssistantMood].grad, display: "inline-block" }} />
          <span style={{ fontSize: "0.85rem", fontWeight: 700 }}>
            {firstName ? `Welcome back, ${firstName}` : "Clarity"}
          </span>
        </div>

        <div className="mb-chat-messages-full" ref={scrollRef}>
          {messagesLoading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", fontSize: "0.86rem" }}>Loading conversation…</div>
          )}
          {!messagesLoading && messages.length === 0 && !loading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", maxWidth: 380 }}>
              <div className="mb-avatar" style={{ margin: "0 auto 0.9rem" }}><Mascot size={48} /></div>
              <p style={{ fontSize: "1rem", fontWeight: 700, color: "var(--text)" }}>{firstName ? `Hi ${firstName}, I'm Clarity 👋` : "Hi, I'm Clarity 👋"}</p>
              <p style={{ fontSize: "0.88rem", marginTop: "0.3rem" }}>Whatever's on your mind — a symptom, a worry, or just not knowing where to start.</p>
              <div style={{ display: "flex", gap: "0.5rem", flexWrap: "wrap", justifyContent: "center", marginTop: "1.1rem" }}>
                {CHAT_STARTERS.map((s) => (
                  <button key={s} className="mb-chip" onClick={() => sendMessage(s)}>{s}</button>
                ))}
              </div>
            </div>
          )}
          {!messagesLoading && messages.map((m, i) => (
            <div key={i} className={`mb-msg-row ${m.role}`}>
              {m.role === "assistant" && <div className="mb-avatar" style={{ background: MOOD_META[m.mood || "calm"].grad }}><Mascot size={48} mood={m.mood || "calm"} /></div>}
              <div className={`mb-bubble ${m.role}`}>
                <span className="mb-bubble-label">{m.role === "user" ? "You" : `Clarity${m.mood && m.mood !== "calm" ? ` · ${MOOD_META[m.mood].label}` : ""}`}</span>
                {m.attachments && m.attachments.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem", marginBottom: m.content ? "0.5rem" : 0 }}>
                    {m.attachments.map((a) => <AttachmentThumb key={a.id} attachment={a} size={84} />)}
                  </div>
                )}
                {m.content && <span style={{ whiteSpace: "pre-wrap" }}>{renderInline(m.content)}</span>}
              </div>
            </div>
          ))}
          {showFeedback && (
            <FeedbackPrompt session={session} conversationId={activeId} onDone={() => setFeedbackDismissed(true)} />
          )}
          {loading && (
            <div className="mb-msg-row assistant">
              <div className="mb-avatar"><Mascot size={48} talking /></div>
              <div className="mb-bubble assistant">
                <span className="mb-typing-dot" /><span className="mb-typing-dot" /><span className="mb-typing-dot" />
              </div>
            </div>
          )}
          {error && <div className="mb-bubble assistant" style={{ background: "#FEF2F2", color: "#B91C1C" }}>{error}</div>}
        </div>

        <div className="mb-chat-input-wrap">
          {attachments.length > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: "0.5rem", padding: "0 0.2rem 0.7rem" }}>
              {attachments.map((a) => (
                <AttachmentThumb key={a.id} attachment={a} onRemove={() => removeAttachment(a.id)} />
              ))}
            </div>
          )}
          {attachError && <p style={{ color: "#B91C1C", fontSize: "0.78rem", padding: "0 0.2rem 0.5rem", margin: 0 }}>{attachError}</p>}
          <form className="mb-input-row mb-card" onSubmit={handleSubmit} style={{ borderTop: "none" }}>
            <input type="file" ref={fileInputRef} accept="image/*,application/pdf" multiple style={{ display: "none" }} onChange={handleFilesSelected} />
            <input type="file" ref={cameraInputRef} accept="image/*" capture="environment" style={{ display: "none" }} onChange={handleFilesSelected} />
            <button type="button" className="mb-attach-btn" onClick={() => fileInputRef.current?.click()} aria-label="Attach image or file" title="Attach image or file">
              <Paperclip size={18} />
            </button>
            <button type="button" className="mb-attach-btn" onClick={openCamera} aria-label="Take a photo" title="Take a photo">
              <CameraIcon size={18} />
            </button>
            <textarea
              className="mb-input"
              rows={1}
              placeholder="Share what's on your mind…"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  handleSubmit(e);
                }
              }}
            />
            <button type="submit" className="mb-send" disabled={loading || (!input.trim() && attachments.length === 0)} aria-label="Send">
              <Send size={16} />
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function SafetySection() {
  return (
    <section style={{ position: "relative", maxWidth: 740, margin: "0 auto", padding: "1rem 1.25rem 3rem", zIndex: 1 }}>
      <div className="mb-card" style={{ padding: "1.6rem", background: "linear-gradient(135deg, #FFFBEB, #FFF)", borderColor: "#FDE68A" }}>
        <div style={{ display: "flex", gap: "0.7rem", alignItems: "flex-start" }}>
          <div className="mb-icon-badge" style={{ background: "var(--accent)" }}>
            <ShieldCheck size={20} />
          </div>
          <div>
            <h3 style={{ fontWeight: 700, marginBottom: "0.5rem" }}>What MediReach is — and isn't</h3>
            <p style={{ fontSize: "0.9rem", marginBottom: "0.6rem" }}>
              Clarity gives general medical information and encourages you toward professional care. It does not
              diagnose conditions, prescribe treatment, or replace a licensed clinician.
            </p>
            <p style={{ fontSize: "0.9rem" }}>
              <strong>In an emergency,</strong> call your local emergency number right away. <strong>In an emotional
              crisis or if you're thinking about suicide,</strong> in the US you can call or text 988 (Suicide &
              Crisis Lifeline) any time.
            </p>
          </div>
        </div>
      </div>
    </section>
  );
}

const ABOUT_CARDS = [
  {
    title: "Who I am",
    body: "I'm 16, in Year 12 at Cranleigh Abu Dhabi, and genuinely obsessed with medicine — especially eyes. I want to become an ophthalmologist one day.",
  },
  {
    title: "Why I started MediReach",
    body: "Most people don't skip the doctor because they don't care. They skip it because healthcare feels confusing. Clarity explains things simply, honestly, and always points you toward real care.",
  },
  {
    title: "Where this is going",
    body: "MediReach is just getting started. I'll keep building it for as long as I'm working toward becoming a doctor myself.",
  },
  {
    title: "Sources",
    body: "PatientPoint, 2023 & 2024 Patient Confidence Index (surveys of 2,000 U.S. adults).",
  },
];

function AboutUsPage({ onGoToChat }) {
  return (
    <div style={{ position: "relative", maxWidth: 860, margin: "0 auto", padding: "3rem 1.25rem 4rem", zIndex: 1 }}>
      <div className="mb-avatar-hero" style={{ background: "var(--grad-1)" }}>
        <span style={{ color: "#fff", fontWeight: 800, fontSize: "2.2rem", fontFamily: "'Plus Jakarta Sans', sans-serif" }}>AA</span>
      </div>
      <h1 style={{ fontSize: "clamp(1.8rem, 4.5vw, 2.6rem)", fontWeight: 800, textAlign: "center", marginBottom: "0.3rem" }}>
        Ali Al Saad
      </h1>
      <p style={{ textAlign: "center", color: "var(--text-muted)", fontWeight: 600, marginBottom: "2.25rem" }}>
        Founder & CEO, MediReach · Year 12, Cranleigh Abu Dhabi
      </p>

      <TiltCard className="mb-card hoverable" style={{ padding: "1.75rem", marginBottom: "1.25rem" }}>
        <Quote size={22} color="var(--primary)" style={{ marginBottom: "0.7rem" }} />
        <p style={{ fontSize: "1.05rem", fontWeight: 600, lineHeight: 1.6 }}>
          I don't want anyone to put off understanding their own body just because medicine feels like it wasn't built for them to understand it.
        </p>
      </TiltCard>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: "1.1rem", marginBottom: "2rem" }}>
        {ABOUT_CARDS.map((c) => (
          <TiltCard key={c.title} className="mb-card hoverable" style={{ padding: "1.5rem" }}>
            <h2 style={{ fontSize: "1.05rem", fontWeight: 800, marginBottom: "0.6rem" }}>{c.title}</h2>
            <p style={{ fontSize: "0.9rem", lineHeight: 1.6, color: c.title === "Sources" ? "var(--text-muted)" : "var(--text)" }}>{c.body}</p>
          </TiltCard>
        ))}
      </div>

      <div style={{ textAlign: "center" }}>
        <p style={{ fontWeight: 700, marginBottom: "1.25rem" }}>— Ali Al Saad, Founder & CEO</p>
        <RippleButton className="mb-btn" onClick={onGoToChat}>
          <MessageCircle size={17} /> Talk to Clarity
        </RippleButton>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* APP SHELL                                                            */
/* ------------------------------------------------------------------ */

const NAV_LINKS = [
  { id: "why", label: "Why This Matters", type: "anchor" },
  { id: "how", label: "How It Works", type: "anchor" },
  { id: "chat", label: "Chat with Clarity", type: "page" },
  { id: "about", label: "About Us", type: "page" },
];

function HomePage({ onGoToChat }) {
  return (
    <>
      <Hero onStart={onGoToChat} />
      <StatsSection />
      <HowItWorks />
      <SafetySection />
    </>
  );
}

function ChatPage({ session, sessionLoading, onSignOut, guest, onGuest, onGoHome }) {
  if (sessionLoading) {
    return <p style={{ textAlign: "center", color: "var(--text-muted)", fontSize: "0.9rem", paddingTop: "3rem" }}>Loading…</p>;
  }
  if (session || !SUPABASE_READY || guest) {
    return <ChatWorkspace session={session} onSignOut={onSignOut} onGoHome={onGoHome} />;
  }
  return (
    <div style={{ maxWidth: 740, margin: "0 auto", padding: "2.5rem 1.25rem 3rem" }}>
      <h2 style={{ fontSize: "1.9rem", fontWeight: 800, marginBottom: "0.5rem", textAlign: "center" }}>Talk to Clarity</h2>
      <p style={{ color: "var(--text-muted)", textAlign: "center", marginBottom: "1.75rem", fontSize: "0.94rem" }}>
        Sign in first so Clarity can save and remember your conversations.
      </p>
      <AuthPanel />
      <p style={{ textAlign: "center", marginTop: "1.25rem" }}>
        <button className="mb-navlink" onClick={onGuest}>Continue as guest — skip saving history</button>
      </p>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [pendingScroll, setPendingScroll] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrollPct, setScrollPct] = useState(0);
  const [session, setSession] = useState(null);
  const [sessionLoading, setSessionLoading] = useState(SUPABASE_READY);
  const [guest, setGuest] = useState(false);

  useEffect(() => {
    if (!SUPABASE_READY) return;
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setSessionLoading(false);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const signOut = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    setMenuOpen(false);
  };

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const pct = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
      setScrollPct(Math.min(1, Math.max(0, pct)));
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    if (page === "home" && pendingScroll) {
      const id = pendingScroll;
      const t = setTimeout(() => {
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
        setPendingScroll(null);
      }, 60);
      return () => clearTimeout(t);
    }
  }, [page, pendingScroll]);

  const goHome = () => {
    setPage("home");
    setGuest(false);
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const immersiveChat = page === "chat" && !sessionLoading && (session || !SUPABASE_READY || guest);

  const goToChat = () => {
    setPage("chat");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const navigate = (link) => {
    setMenuOpen(false);
    if (link.type === "page") {
      setPage(link.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (page !== "home") {
      setPendingScroll(link.id);
      setPage("home");
    } else {
      document.getElementById(link.id)?.scrollIntoView({ behavior: "smooth" });
    }
  };

  return (
    <div className={`mb-root ${immersiveChat ? "mb-root-chat" : ""}`}>
      <GlobalStyles />
      {!immersiveChat && <Blobs />}

      {!immersiveChat && <nav className="mb-nav">
        <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0.85rem 1.25rem", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={goHome} style={{ background: "none", border: "none", fontSize: "1.15rem", fontWeight: 800, color: "var(--text)", cursor: "pointer", display: "flex", alignItems: "center", gap: "0.5rem", fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
            <span style={{ width: 30, height: 30, borderRadius: 9, background: "var(--grad-1)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 14px -4px rgba(37,99,235,0.55), inset 0 1px 0 rgba(255,255,255,0.35)" }}>
              <Mascot size={25} />
            </span>
            MediReach
          </button>
          <div style={{ display: "none", gap: "1.5rem" }} className="mb-nav-desktop">
            {NAV_LINKS.map((l) => (
              <button
                key={l.id}
                className="mb-navlink"
                style={l.type === "page" && page === l.id ? { color: "var(--primary)" } : undefined}
                onClick={() => navigate(l)}
              >
                {l.label}
              </button>
            ))}
          </div>
          {SUPABASE_READY && session && (
            <span style={{ display: "none", fontSize: "0.78rem", color: "var(--text-muted)", fontWeight: 600 }} className="mb-nav-desktop">
              {session.user.email} · <button onClick={signOut} className="mb-navlink" style={{ padding: 0, fontSize: "0.78rem", display: "inline" }}>Sign out</button>
            </span>
          )}
          <RippleButton className="mb-btn ghost" style={{ padding: "0.55rem 1.1rem", display: "none", fontSize: "0.85rem" }} id="mb-nav-cta" onClick={goToChat}>
            {SUPABASE_READY && session ? "Talk now" : SUPABASE_READY ? "Sign in" : "Talk now"}
          </RippleButton>
          <button className="mb-navlink" style={{ display: "inline-flex" }} onClick={() => setMenuOpen((m) => !m)} aria-label="Toggle menu">
            <Menu size={20} />
          </button>
        </div>
        <style>{`
          @media (min-width: 760px) {
            .mb-nav-desktop { display: flex !important; }
            #mb-nav-cta { display: inline-flex !important; }
            .mb-nav > div > button[aria-label="Toggle menu"] { display: none !important; }
          }
        `}</style>
        {menuOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: "0.5rem", padding: "0 1.25rem 1rem" }}>
            {NAV_LINKS.map((l) => (
              <button key={l.id} className="mb-navlink" style={{ textAlign: "left" }} onClick={() => navigate(l)}>{l.label}</button>
            ))}
            {SUPABASE_READY && session && (
              <button className="mb-navlink" style={{ textAlign: "left" }} onClick={signOut}>Sign out ({session.user.email})</button>
            )}
          </div>
        )}
      </nav>}
      {!immersiveChat && <div className="mb-progress" style={{ transform: `scaleX(${scrollPct})` }} />}

      {page === "home" ? (
        <HomePage onGoToChat={goToChat} />
      ) : page === "about" ? (
        <AboutUsPage onGoToChat={goToChat} />
      ) : (
        <ChatPage session={session} sessionLoading={sessionLoading} onSignOut={signOut} guest={guest} onGuest={() => setGuest(true)} onGoHome={goHome} />
      )}

      {!immersiveChat && (
        <footer style={{ position: "relative", borderTop: "1px solid var(--border)", padding: "2rem 1.25rem", textAlign: "center", zIndex: 1 }}>
          <p style={{ fontSize: "0.82rem", color: "var(--text-muted)" }}>
            MediReach · Built by {STUDENT_NAME} · Not a substitute for professional medical advice
          </p>
        </footer>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
